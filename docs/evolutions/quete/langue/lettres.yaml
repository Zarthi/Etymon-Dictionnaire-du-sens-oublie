# Les lettres du Centre : les figures symétriques de la grille 3 × 3, ⬛ plein, ⬜ vide.
# La grille vide n'est pas une lettre : le Principe. Le sens de chaque lettre est dans README.md.

- nombre: 1
  nom: le centre
  figure: [⬜⬜⬜, ⬜⬛⬜, ⬜⬜⬜]
  sens: l'Un

- nombre: 2
  nom: en face, verticale
  figure: [⬜⬛⬜, ⬜⬜⬜, ⬜⬛⬜]
  sens: les deux contraires de l'axe, le haut et le bas
- nombre: 2
  nom: en face, horizontale
  figure: [⬜⬜⬜, ⬛⬜⬛, ⬜⬜⬜]
  sens: les deux contraires du plan, l'avant et l'après
- nombre: 2
  nom: en face, diagonale
  figure: [⬛⬜⬜, ⬜⬜⬜, ⬜⬜⬛]
  sens: deux contraires intermédiaires
- nombre: 2
  nom: en face, autre diagonale
  figure: [⬜⬜⬛, ⬜⬜⬜, ⬛⬜⬜]
  sens: deux contraires intermédiaires

- nombre: 3
  nom: la colonne
  figure: [⬜⬛⬜, ⬜⬛⬜, ⬜⬛⬜]
  sens: les extrêmes et le milieu sur l'axe ; ce qui est
- nombre: 3
  nom: la ligne
  figure: [⬜⬜⬜, ⬛⬛⬛, ⬜⬜⬜]
  sens: l'avant, le présent, l'après ; ce qui devient
- nombre: 3
  nom: la diagonale
  figure: [⬛⬜⬜, ⬜⬛⬜, ⬜⬜⬛]
  sens: à préciser
- nombre: 3
  nom: l'autre diagonale
  figure: [⬜⬜⬛, ⬜⬛⬜, ⬛⬜⬜]
  sens: à préciser

- nombre: 4
  nom: les bras
  figure: [⬜⬛⬜, ⬛⬜⬛, ⬜⬛⬜]
  sens: le cycle dans ce qu'il a de mouvant, un carré posé sur un angle ; sans centre, le cycle vu en lui-même
- nombre: 4
  nom: les coins
  figure: [⬛⬜⬛, ⬜⬜⬜, ⬛⬜⬛]
  sens: le cycle dans ce qu'il a de stable, un carré posé sur sa base ; sans centre, le cycle vu en lui-même

- nombre: 5
  nom: la croix
  figure: [⬜⬛⬜, ⬛⬛⬛, ⬜⬛⬜]
  sens: la verticale qui croise l'horizontale en son centre, ce qui est et ce qui devient en un même point ; les bras sont sur les axes, ils se lisent comme des lignes
- nombre: 5
  nom: le × plein
  figure: [⬛⬜⬛, ⬜⬛⬜, ⬛⬜⬛]
  sens: le cycle et son centre ; les coins ne sont sur aucun axe, ils se lisent comme des points autour du centre

- nombre: 6
  nom: deux lignes
  figure: [⬛⬛⬛, ⬜⬜⬜, ⬛⬛⬛]
  sens: deux « ce qui devient », le plan d'en haut et le plan d'en bas, séparés
- nombre: 6
  nom: deux colonnes
  figure: [⬛⬜⬛, ⬛⬜⬛, ⬛⬜⬛]
  sens: deux « ce qui est », deux totalités, deux principes séparés

- nombre: 7
  nom: le I
  figure: [⬛⬛⬛, ⬜⬛⬜, ⬛⬛⬛]
  sens: les deux plans reliés par l'axe, le firmament entre les eaux (Genèse 1, 6-7)
- nombre: 7
  nom: le H
  figure: [⬛⬜⬛, ⬛⬛⬛, ⬛⬜⬛]
  sens: deux « ce qui est » reliés par un pont en leur milieu

- nombre: 8
  nom: le pourtour
  figure: [⬛⬛⬛, ⬛⬜⬛, ⬛⬛⬛]
  sens: le cercle entier autour du point ; le monde autour du principe

- nombre: 9
  nom: le tout
  figure: [⬛⬛⬛, ⬛⬛⬛, ⬛⬛⬛]
  sens: le centre et tout ce qui l'entoure
