# Un mot : la croix dans la grille 3 × 3. La colonne dit ce qui est, la ligne ce qui devient ;
# ~ est une case vide ; les coins restent vides.
mot: le démon
grille:
  - [~, 🔥, ~]
  - [~, ⬇️, ~]
  - [~, ⛰️, ~]
lecture: >
  Un feu tombé jusqu'au fond de la fosse : « astre brillant » (הֵילֵל), « tombé du ciel »,
  « aux profondeurs de la fosse ». L'ange est le même feu qui n'est pas descendu.
signee: Isaïe 14, 12-15
statut: proposition de l'agent, à valider
