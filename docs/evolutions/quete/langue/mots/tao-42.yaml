# Un mot : une suite de lettres du Centre, et son récit en Pourtour, signé.
mot: la genèse selon le Tao
centre:
  - le centre
  - en face, verticale
  - la colonne
lecture: >
  « Le Tao produit l'Un, l'Un produit le Deux, le Deux produit le Trois, le Trois produit les
  dix mille êtres. » Le Tao est la grille vide, avant le mot ; les dix mille êtres sont le
  Pourtour, après lui.
signee: Tao Te King, 42 (de mémoire)
statut: proposition de l'agent, à valider
