# Une tétraktys par tradition : ce que chacune donne à chaque rang, dans ses propres mots.
# « ? » : la tradition ne donne rien de sûr à ce rang. Vérifié ou de mémoire, à chaque fois.

- tradition: Genèse 1
  rangs:
    - [le principe]
    - [la lumière, les ténèbres]
    - [les eaux d'en haut, le firmament, les eaux d'en bas]
    - ["?"]
  sources:
    - Genèse 1, 4 (vérifié, Sefaria) : « Dieu sépara la lumière et les ténèbres »
    - Genèse 1, 6-7 (vérifié) : le firmament « au milieu des eaux », les eaux « au-dessous » et « au-dessus »
    - rang 4, candidat non retenu : les quatre têtes du fleuve d'Éden, Genèse 2, 10 (vérifié)

- tradition: Platon, Timée
  rangs:
    - [le dieu]
    - [le feu, la terre]
    - [le feu, une médiété, la terre]
    - [le feu, l'air, l'eau, la terre]
  sources:
    - Timée 31c-32b (vérifié, Perseus) : deux extrêmes ; une médiété si le monde était plan ; deux parce qu'il est solide

- tradition: hindoue
  rangs:
    - [Brahman]
    - [sattva, tamas]
    - [sattva, rajas, tamas]
    - ["?"]
  sources:
    - Bhagavad-Gītā XIV, 18 (vérifié) : sattva en haut, rajas au milieu, tamas en bas
    - rang 4 : cinq éléments, l'éther en premier (Taittirīya Upaniṣad II, 1, de mémoire) ; ne se rangent pas d'eux-mêmes en quatre

- tradition: Sefer Yetzirah
  rangs:
    - [le Nom]
    - [le feu en haut, l'eau en bas]
    - [le feu, le souffle qui décide entre les deux, l'eau]
    - ["?"]
  sources:
    - Sefer Yetzirah 3 (vérifié, Sefaria, éd. Varsovie 1884) : les trois lettres mères
    - rang 4 : la terre y est « créée de l'eau », non un quatrième (vérifié)

- tradition: pythagoricienne
  rangs:
    - [la monade]
    - [la dyade]
    - [la triade]
    - [la tétrade]
  sources:
    - un terme par rang, le point, la ligne, la surface, le solide (Sextus Empiricus ; Théon de Smyrne, onze tétraktys ; de mémoire)

- tradition: chinoise
  rangs:
    - [le Faîte suprême]
    - [le yin, le yang]
    - [le Ciel, l'Homme, la Terre]
    - [le grand yang, le petit yin, le petit yang, le grand yin]
  sources:
    - Xici (Grand commentaire du Yi Jing), de mémoire : « le Faîte suprême engendre les deux modes, les deux modes les quatre images » ; les trois puissances (san cai) dans le Shuogua, de mémoire
    - les quatre images viennent des deux modes par dédoublement (1, 2, 4), non par un rang de trois
