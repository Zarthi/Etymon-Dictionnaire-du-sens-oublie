# Les tétraktys de la langue qui ne se parle pas. Règles dans README.md.
# Une tétraktys : dix points en quatre rangs ; les extrêmes du rang 2 se prolongent sur les
# côtés ; chaque rang ajoute des moyens à l'intérieur (rang 3 : un, sur l'axe ; rang 4 : deux).
# Les emoji sont les noms des signes ; leur sens est leur place.

- nom: principale
  sommet: le principe, sans signe ; le centre en est la trace
  rangs:
    - [🔘]
    - [⬆️, ⬇️]
    - [⬆️, 🔘, ⬇️]
    - [🔥, 💨, 💧, ⛰️]
  signes: [🔘, 🔥, 💨, 💧, ⛰️]
  a-trancher: ⬆️ et ⬇️ comme signes des mots ; où passent ⬅️ et ➡️, s'ils sont nécessaires
  raison: >
    Deux extrêmes, le haut et le bas ; une médiété pour le plan, le centre, où le plan coupe
    l'axe ; deux médiétés pour le solide, d'où quatre degrés entre les extrêmes : le feu, l'air,
    l'eau, la terre (Platon, Timée, 31c-32b, vérifié). Les extrêmes se retrouvent aux bouts de
    chaque rang parce qu'ils sont sur les côtés du triangle ; le centre est sur l'axe, comme le
    sommet : il en est la continuation.
  lectures:
    - texte: >
        Les trois premiers rangs sont les principes, sans corps (point, ligne, plan) ; la base est
        la manifestation, le solide. Le rang 3 est les trois guṇa : sattva ⬆️, rajas 🔘 (la
        tendance horizontale, le plan), tamas ⬇️. Chaque signe de la base vient des deux points du
        rang 3 qui le surplombent : 🔥 = ⬆️ ⬆️, 💨 = ⬆️ 🔘, 💧 = 🔘 ⬇️, ⛰️ = ⬇️ ⬇️ ; le feu et la
        terre par les côtés, deux fois haut, deux fois bas. Le mélange rajas · rajas n'a pas de
        point : la base n'en a aucun sur l'axe. C'est la place de l'éther, la quintessence, que la
        tradition met au centre des quatre et non parmi eux : le principe n'entre pas dans le monde
        comme un cinquième ; sa trace y est un creux. Dans un mot, l'éther s'écrit 🔘.
      signee: Thibault, avec l'agent
      confirme: >
        Platon, Timée, 31c-32b (vérifié) ; Guénon, Le Symbolisme de la croix, ch. V, et Gītā XIV,
        18 pour les guṇa (vérifiés) ; de mémoire : Aristote, Du ciel, IV (le feu absolument léger,
        l'air relativement, l'eau relativement lourde, la terre absolument) ; Timée, 55c (le
        cinquième solide « pour le tout »).
