name: Validation et déploiement

on:
  push:
  pull_request:
  # Publication manuelle seulement : onglet Actions, « Run workflow » sur main.
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validation des fiches, candidats et comptes
        run: npm run valider
      - name: Build (assemble aussi src/generes/, requis par la vérification des types)
        run: npm run build
      - name: Vérification des types
        run: npm run check
      - name: Tests
        run: npm test
      - name: Publication du site construit
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploiement:
    # Publication déclenchée à la main, depuis main, et seulement si la validation a réussi.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
