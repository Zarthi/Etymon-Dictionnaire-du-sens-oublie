name: Validation

# Chaque push, sur toute branche, et chaque pull request venue d'un fork.
# Aussi appelée par la publication, qui ne publie que ce qui a passé la validation.
on:
  push:
  pull_request:
  workflow_call:

# Un nouveau push sur la même branche annule la validation en cours, devenue inutile.
# (Appelée par la publication, elle en reçoit l'événement, workflow_dispatch : jamais annulée.)
concurrency:
  group: validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  validation:
    # Une pull request du dépôt lui-même est déjà validée par le push de sa branche.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validation des fiches, candidats et comptes
        run: npm run valider
      - name: Build (assemble aussi src/generes/, requis par la vérification des types)
        run: npm run build
      - name: Vérification des types
        run: npm run check
      - name: Tests (dont contrat et consignes à jour)
        run: npm test
      - name: Site construit, pour la publication
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
