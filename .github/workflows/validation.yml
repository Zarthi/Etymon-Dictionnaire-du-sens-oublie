name: Validation

on:
  push:
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validation des fiches, candidats et comptes
        run: npm run valider
      - name: Build (assemble aussi src/generes/, requis par la vérification des types)
        run: npm run build
      - name: Vérification des types
        run: npm run check
      - name: Tests
        run: npm test
