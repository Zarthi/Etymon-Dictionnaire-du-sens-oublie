name: Publication

# Publication sur GitHub Pages, à la main seulement : onglet Actions, « Run workflow » sur main.
on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validation:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validation.yml

  deploiement:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
