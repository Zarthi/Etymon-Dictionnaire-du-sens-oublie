nom: Rabban Gamliel
description: >-
  Maître de la loi orale que la Michna cite sous ce nom ; deux maîtres l'ont porté,
  Gamliel l'Ancien et Gamliel de Yavné, et l'attribution d'un passage reste parfois
  discutée.
