tradition:
  lectures:
    - texte: "Mentir n'est pas dire un mensonge : qui ment n'est pas trompé lui-même, il cherche à tromper autrui ; qui dit un mensonge est trompé lui-même."
      citation: "Inter mendacium dicere et mentiri distat. Qui mentitur, ipse non fallitur, alterum fallere conatur; qui mendacium dicit, ipse fallitur."
      auteur: nigidius-figulus
      sources:
