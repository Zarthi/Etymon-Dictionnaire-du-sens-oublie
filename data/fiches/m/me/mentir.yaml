mot: mentir
nature: [ verbe ]
etymologie:
  - forme: mentiri
    langue: latin
  - forme: mens
    langue: latin
    sens: esprit, imagination
explication: >-
  Mentiri aurait d'abord signifié inventer, imaginer ; le verbe latin disait
  aussi se tromper et contrefaire. En français, mentir, c'est affirmer pour vrai
  ce qu'on sait faux, ou nier ce qui est vrai.
incertain: true
famille: [ menteur, démentir, mental, mensonge ]
