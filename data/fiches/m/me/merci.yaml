mot: merci
nature: [ interjection, nom féminin, nom masculin ]
etymologie:
  - forme: merces
    langue: latin
    sens: salaire, récompense
explication: >-
  À basse époque, merces avait pris le sens de grâce accordée à qui l'on
  épargne : c'est le premier sens de merci en français (881). Grand merci, vers
  1135, c'est la grande faveur que vous me faites ; de là le remerciement. La
  grâce reste dans être à la merci de quelqu'un.
famille: [ remercier, remerciement ]
themes: [ parole ]
