mot: merci
nature: [ nom féminin, nom masculin ]
etymologie:
  - forme: merces
    langue: latin
    sens: salaire, récompense
explication: >
  Le mot latin désignait un salaire, une récompense. À basse époque, il devient
  la grâce qu'on accorde en épargnant quelqu'un ; dire merci, c'est reconnaître
  cette faveur.
famille: [ marchand ]
themes: [ argent, parole ]
sources:
  - ouvrage: littre
    entree: merci
  - ouvrage: gaffiot
    entree: merces
  - ouvrage: tlfi
    entree: merci
redaction:
  - par: IA
    detail: Claude Opus 5.5
statut: brouillon
