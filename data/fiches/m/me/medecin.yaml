  - forme: mederi
    langue: latin
    sens: soigner, traiter
explication: >-
  Medicus, « médecin », vient de mederi, « soigner ». Le mot a évincé l'ancien
  mire ; son sens figuré de guérisseur des âmes est attesté au xviie siècle, et
  l'usage courant garde le praticien de la médecine.
