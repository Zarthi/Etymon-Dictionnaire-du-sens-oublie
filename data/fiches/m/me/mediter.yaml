mot: mediter
nature: [ verbe ]
etymologie:
  - forme: meditari
    langue: latin
    sens: s'exercer, préparer
  - forme: medeor
    langue: latin
    sens: soigner
explication: >-
  Meditari était le fréquentatif de medeor, soigner : méditer, c'était s'exercer
  avec soin, préparer longtemps. Le mot dit aujourd'hui une réflexion
  intérieure, alors qu'il désignait d'abord un soin appliqué.
