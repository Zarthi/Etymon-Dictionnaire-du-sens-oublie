mot: magistrat
nature: [ nom masculin ]
etymologie:
  - forme: magistratus
    langue: latin
    sens: charge de magister, fonction publique
  - forme: magister
    langue: latin
    sens: chef, maître
    elements:
      - forme: magis
        sens: plus
      - forme: -ter
        sens: suffixe de comparatif
explication: >-
  Magistratus nommait la charge avant celui qui l'exerce ; en français aussi, le
  mot a dit la fonction publique (vers 1355), puis l'officier civil (1538) et le
  membre de l'ordre judiciaire (1548). Il désigne aujourd'hui qui détient une
  autorité publique, en particulier qui rend la justice.
famille: [ magistrature, maître ]
renvois: [ juge ]
themes: [ droit, politique ]
tradition:
  lectures:
    - texte: Le dictateur, qui a le pouvoir suprême sur le peuple, est aussi appelé
        magister populi, comme le maître de la cavalerie, magister equitum ; les
        autres, moindres que ces magistri, ont été dits magistratus.
      citation: Magister equitum, quod summa potestas huius in equites et accensos, ut
        est summa populi dictator, a quo is quoque magister populi appellatus.
        Reliqui, quod minores quam hi magistri, dicti magistratus, ut ab albo
        albatus.
      sources:
        - ouvrage: de-la-langue-latine
          entree: V, 82
          url: https://www.thelatinlibrary.com/varro.ll5.html
    - texte: Le magister est le plus grand en sa place, statio, que le grec dit
        steron ; le minister, le moindre.
      citation: 'Magister, maior in statione: nam "steron" Graece statio dicitur.
        Minister, minor in statione'
      sources:
        - ouvrage: etymologies
          entree: X, 170
          url: https://la.wikisource.org/wiki/Etymologiarum_libri_XX/Liber_X
sources:
  - ouvrage: littre
    entree: magistrat
  - ouvrage: tlfi
    entree: magistrat
  - ouvrage: lewis-short
    entree: magistratus
  - ouvrage: lewis-short
    entree: magister
redaction:
