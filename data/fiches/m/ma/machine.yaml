mot: machine
nature: [ nom féminin ]
etymologie:
  - forme: machina
    langue: latin
    sens: machine, engin
  - forme: μηχανή
    langue: grec ancien
    sens: invention ingénieuse, machine
explication: >-
  Le grec μηχανή disait une invention ingénieuse, un engin, et, au figuré, un
  expédient. Le mot français a suivi l'histoire des techniques : machine de
  guerre, machine à vapeur, machine-outil, et, au figuré, machination.
famille: [ machiner, machination, machinisme, machiniste, mécanique ]
