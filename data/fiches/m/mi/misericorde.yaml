mot: miséricorde
nature: [ nom féminin ]
etymologie:
  - forme: misericordia
    langue: latin
    sens: compassion, pitié
  - forme: misericors
    langue: latin
    sens: qui a le cœur sensible au malheur
    elements:
      - forme: miser
        sens: malheureux
      - forme: cor
        sens: cœur
explication: >-
  Le mot unit la misère et le cœur : il désigne la pitié de celui que touche le malheur
  d'autrui. L'usage l'a surtout réservé au pardon, en particulier à celui de Dieu.
famille: [ miséricordieux ]
themes: [ religion, morale ]
sources:
  - ouvrage: littre
    entree: miséricorde
  - ouvrage: tlfi
    entree: miséricorde
redaction:
  - par: IA
    detail: Claude Opus 5.5
statut: brouillon
