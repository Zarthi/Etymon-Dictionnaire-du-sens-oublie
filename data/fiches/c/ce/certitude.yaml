redaction:
  - par: IA
    detail: Claude Opus 5.5
    reflexion: élevée
tradition:
  lectures:
    - texte: "La certitude est par essence dans la faculté de connaître, et par participation dans tout ce qu'une faculté de connaître meut sans faillir vers sa fin : ainsi dit-on que la nature agit avec certitude, mue par l'intelligence divine."
      citation: "certitudo invenitur in aliquo dupliciter, scilicet essentialiter, et participative. Essentialiter quidem invenitur in vi cognoscitiva, participative autem in omni eo quod a vi cognoscitiva movetur infallibiliter ad finem suum; secundum quem modum dicitur quod natura certitudinaliter operatur, tanquam mota ab intellectu divino certitudinaliter movente unumquodque ad suum finem."
      sources:
        - ouvrage: somme-theologique
          entree: "IIa-IIae, q. 18, a. 4, co."
          url: https://www.corpusthomisticum.org/sth3017.html
statut: brouillon
