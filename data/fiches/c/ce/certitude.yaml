mot: certitude
nature: [ nom féminin ]
etymologie:
  - forme: certitudo
    langue: bas latin
  - forme: certus
    langue: latin
    sens: décidé, fixé
  - forme: cernere
    langue: latin
    sens: séparer, cribler ; discerner, décider
explication: >-
  Certus, participe de cernere, se disait de ce qui a été décidé, fixé.
  Certitude a d'abord nommé le caractère de ce qui est certain (vers 1375), puis
  l'état de l'esprit qui tient une chose pour hors de doute (1462) : le mot est
  passé de la chose fixée à l'esprit.
famille: [ certain, certes, incertitude, discerner, certifier ]
renvois: [ evidence ]
themes: [ esprit, savoir ]
