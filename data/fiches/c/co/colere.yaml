mot: colère
nature: [ nom féminin ]
etymologie:
  - forme: cholera
    langue: latin
    sens: maladie bilieuse, bile
  - forme: χολέρα
    langue: grec ancien
    sens: choléra
explication: >-
  Vers 1265, colère nommait la bile, quand l'emportement se disait ire ; le sens
  d'état affectif violent, que cholera avait pris chez Jérôme, n'est attesté
  qu'en 1416. Le mot grec, d'où vient aussi choléra, nommait la maladie.
renvois: [ fureur, rage ]
themes: [ émotions ]
sources:
