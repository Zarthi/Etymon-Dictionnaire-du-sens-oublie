mot: conscience
nature: [ nom féminin ]
etymologie:
  - forme: conscientia
    langue: latin
    sens: connaissance en commun
    elements:
      - forme: cum
        sens: avec
      - forme: scientia
        sens: savoir
explication: >-
  Conscientia désigne d'abord la connaissance partagée avec un autre, celle d'un complice
  ou d'un témoin, puis celle qu'on a de soi-même. Le sens moral, un jugement intérieur sur
  le bien et le mal, est venu ensuite.
famille: [ conscient, inconscient ]
themes: [ esprit, morale ]
sources:
  - ouvrage: littre
    entree: conscience
  - ouvrage: tlfi
    entree: conscience
redaction:
  - par: IA
    detail: Claude Opus 5.5
statut: brouillon
