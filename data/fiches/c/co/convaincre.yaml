mot: convaincre
nature: [ verbe ]
etymologie:
  - forme: convincere
    langue: latin
    sens: prouver la culpabilité de, réfuter
    elements:
      - forme: con-
        sens: marque l'achèvement de l'acte
      - forme: vincere
        sens: vaincre
explication: >-
  Convincere, c'était venir à bout d'un adversaire en prouvant sa faute ou son
  erreur. Convaincre a d'abord dit en français amener quelqu'un à reconnaître
  qu'il est coupable (vers 1174), puis, en 1657, l'amener à reconnaître une
  chose pour vraie ; on convainc encore quelqu'un d'un crime.
famille: [ conviction, convaincant, vaincre ]
themes: [ parole, esprit ]
