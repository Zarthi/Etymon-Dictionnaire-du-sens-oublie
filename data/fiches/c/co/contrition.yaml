  - forme: contritio
    langue: latin ecclésiastique
    sens: broyage, écrasement
explication: >-
  Le latin contritio nommait le broyage, l'écrasement ; la langue chrétienne l'a
  appliqué au repentir. Il ne dit plus aujourd'hui qu'un regret religieux, sans
  l'image du broiement.
