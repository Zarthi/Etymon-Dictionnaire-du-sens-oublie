explication: >-
  Companio, formé de cum, avec, et panis, pain, disait celui qui partage le
  pain ; c'est un calque d'un mot germanique. Le mot a gardé l'idée de vie
  commune et d'aide, puis a désigné l'ouvrier qui a terminé son apprentissage.
