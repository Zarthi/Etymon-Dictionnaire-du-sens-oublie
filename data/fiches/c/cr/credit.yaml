mot: crédit
nature: [ nom masculin ]
etymologie:
  - forme: credito
    langue: italien
  - forme: creditum
    langue: latin
    sens: prêt, dette
explication: >-
  En italien, credito a désigné la dette et la confiance en la solvabilité, d'où
  la confiance en général et, au XVe siècle, l'influence. En français,
  l'influence est attestée en 1489, la confiance en 1539 ; vendre à crédit vers
  1508, le crédit opposé au débit en 1675.
famille: [ créditer, créditeur, accréditer, discréditer ]
themes: [ argent, société ]
