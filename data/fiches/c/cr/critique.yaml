mot: critique
nature: [ nom féminin, nom masculin, adjectif ]
etymon: criticus
langue: latin
sens: juge des ouvrages de l'esprit
explication: >
  Le critique est d'abord celui qui sait juger et discerner. Le sens de blâme,
  de jugement défavorable, n'apparaît qu'au XVIIe siècle.
