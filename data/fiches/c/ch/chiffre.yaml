mot: chiffre
nature: [ nom masculin ]
etymologie:
  - forme: cifra
    langue: latin médiéval
    sens: zéro
  - forme: صفر
    translitteration: ṣifr
    langue: arabe
    sens: vide
explication: >-
  Le mot a d'abord désigné le seul zéro, puis tous les signes de numération, puis le
  montant qu'ils écrivent. Zéro, son doublet, a pris le sens que chiffre a perdu.
doublets: [ zero ]
themes: [ savoir ]
sources:
  - ouvrage: littre
    entree: chiffre
  - ouvrage: tlfi
    entree: chiffre
redaction:
  - par: IA
    detail: Claude Opus 5.5
statut: brouillon
