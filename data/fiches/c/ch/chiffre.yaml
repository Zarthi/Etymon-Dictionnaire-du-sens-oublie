mot: chiffre
nature: [ nom masculin ]
etymologie:
  - forme: cifra
    langue: latin médiéval
    sens: zéro
  - forme: صفر
    translitteration: ṣifr
    langue: arabe
    sens: vide
explication: >-
  Chiffre a d'abord nommé le zéro, la nouveauté la plus marquante de la
  numération arabe ; à partir de 1485, tous les signes de cette numération, puis
  le nombre qu'ils écrivent. Zéro, son doublet, a pris le sens que chiffre
  quittait.
doublets: [ zero ]
famille: [ chiffrer, déchiffrer ]
themes: [ savoir ]
sources:
  - ouvrage: tlfi
    entree: chiffre
  - ouvrage: littre
    entree: chiffre
  - ouvrage: tlfi
    entree: zéro
  - ouvrage: littre
    entree: zéro
redaction:
  - par: IA
    detail: Claude Opus 5.5
    reflexion: élevée
statut: brouillon
