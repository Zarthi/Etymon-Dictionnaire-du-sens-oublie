mot: chiffre
nature: [ nom masculin ]
etymologie:
  - forme: cifra
    langue: latin médiéval
    sens: zéro
  - forme: صفر
    translitteration: ṣifr
    langue: arabe
    sens: vide
explication: >-
  Le nom d'un seul signe, celui qui ne compte rien, s'est étendu à tous les
  signes de numération, puis au montant qu'ils écrivent. Zéro, son doublet, a
  repris le sens premier.
doublets: [ zero ]
themes: [ savoir ]
sources:
  - ouvrage: littre
    entree: chiffre
  - ouvrage: tlfi
    entree: chiffre
redaction:
  - par: IA
    detail: Claude Opus 5.5
statut: brouillon
