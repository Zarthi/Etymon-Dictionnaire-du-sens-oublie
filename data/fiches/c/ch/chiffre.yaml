mot: chiffre
nature: [ nom masculin ]
etymologie:
  - forme: cifra
    langue: latin médiéval
    sens: zéro
  - forme: صفر
    translitteration: ṣifr
    langue: arabe
    sens: vide
explication: >
  Le chiffre fut d'abord le zéro, signe vide de toute valeur dans la numération
  venue des Arabes. Le nom de ce signe nouveau s'est ensuite étendu à tous les
  signes de numération.
doublets: [ zero ]
themes: [ savoir ]
sources:
