mot: chapelle
nature: [ nom féminin ]
etymologie:
  - forme: capella
    langue: latin médiéval
    sens: petite cape
  - forme: cappa
    langue: latin
    sens: manteau à capuchon
explication: >-
  Le latin capella est un diminutif de cappa, « cape » : il a désigné la chape
  de saint Martin, puis le lieu où on la gardait. Le mot ne dit plus aujourd'hui
  qu'un édifice secondaire, sans souvenir du vêtement.
