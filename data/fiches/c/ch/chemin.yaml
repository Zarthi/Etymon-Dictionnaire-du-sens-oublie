etymologie:
  - forme: "*cammīnus"
    langue: latin populaire
    sens: chemin
explication: >-
  Le mot vient d'un terme celtique qui disait le pas, passé dans le latin
  populaire. Il désigne la voie, la distance parcourue et, au figuré, les moyens
  d'atteindre un but.
