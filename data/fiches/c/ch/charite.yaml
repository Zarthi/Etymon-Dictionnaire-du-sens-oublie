mot: charité
nature: [ nom féminin ]
etymologie:
  - forme: caritas
    langue: latin
    sens: cherté ; amour, tendresse
  - forme: carus
    langue: latin
    sens: cher, qui coûte cher
explication: >-
  Caritas venait de carus, « cher » : il dit d'abord la cherté, puis l'amour et
  la tendresse. L'Église en a fait le nom de l'amour du prochain, et de l'aumône
  qui l'exprime.
famille: [ cher, chéri, charitable ]
renvois: [ misericorde ]
themes: [ religion, morale ]
sources:
  - ouvrage: littre
    entree: charité
  - ouvrage: tlfi
    entree: charité
redaction:
  - par: IA
    detail: DeepSeek Flash Latest
    reflexion: élevée
tradition:
  lectures:
    - texte: >-
        La charité est une amitié de l'homme pour Dieu, fondée sur la communication de la
        béatitude éternelle.
      citation: >-
        Unde manifestum est quod caritas amicitia quaedam est hominis ad Deum.
      sources:
        - ouvrage: somme-theologique
          entree: "IIa-IIae, q. 23, a. 1, co."
          url: https://www.corpusthomisticum.org/sth3023.html
statut: brouillon
