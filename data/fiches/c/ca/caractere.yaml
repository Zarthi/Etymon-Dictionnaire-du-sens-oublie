explication: >-
  Le mot a suivi la marque gravée : de l'empreinte de monnaie aux lettres et aux
  signes, puis aux traits distinctifs d'une chose et à l'ensemble des traits de
  la personne ; avoir du caractère, c'est être marqué d'une empreinte.
