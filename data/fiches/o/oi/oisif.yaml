mot: oisif
nature: [ adjectif ]
etymologie:
  - forme: oisdif
    langue: ancien français
    croisement:
      - forme: oiseux
        langue: français
  - forme: oisdive
    langue: ancien français
  - forme: oiseux
    langue: français
  - forme: otiosus
    langue: latin
  - forme: otium
    langue: latin
    sens: loisir, temps libre des affaires
explication: >-
  Otium, opposé aux affaires, pouvait être le loisir consacré à l'étude. Oisif
  s'est dit en 1271 d'une bête qui ne sert à rien, puis d'une personne sans
  occupation ; il qualifie aujourd'hui qui ne fait rien, parfois avec une nuance
  péjorative.
