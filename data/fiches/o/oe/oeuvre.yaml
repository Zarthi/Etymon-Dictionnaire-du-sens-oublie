mot: œuvre
nature: [ nom féminin ]
etymologie:
  - forme: opera
    langue: latin
    sens: peine prise à un travail, service
explication: >-
  Opera supposait la libre volonté et le désir de servir. Dès le XIIe siècle,
  œuvre nomme ce que le travail produit et l'action elle-même ; il se dit
  aujourd'hui en particulier de la composition d'un artiste ou d'un écrivain.
famille: [ ouvrage, ouvrier, œuvrer, désœuvré ]
