mot: ouvrage
nature: [ nom masculin ]
etymologie:
  - forme: œuvre
    langue: français
  - forme: opera
    langue: latin
    sens: peine prise à un travail, service
explication: >-
  Au XIIIe siècle, ouvrage nomme l'action de travailler, puis le produit du
  travail (1409) et l'œuvre de l'esprit (1478). Il garde ces trois sens : le
  travail qu'on fait, la chose faite, dont l'ouvrage d'art, et la production de
  l'esprit.
