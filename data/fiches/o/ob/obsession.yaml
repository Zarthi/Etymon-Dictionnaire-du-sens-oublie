mot: obsession
nature: [ nom féminin ]
etymologie:
  - forme: obsessio
    langue: latin
    sens: action d'assiéger, blocus
  - forme: obsidere
    langue: latin
    sens: être installé devant, investir
explication: >-
  En langue d'Église, l'obsession était l'assaut du diable contre une âme qu'il
  presse du dehors sans l'habiter, à la différence de la possession. L'idée fixe
  a gardé l'encerclement, et perdu l'assaillant.
famille: [ obséder, obsédant ]
renvois: [ demon, oppression ]
themes: [ esprit, religion ]
sources:
