mot: obsession
nature: [ nom féminin ]
etymologie:
  - forme: obsessio
    langue: latin
    sens: action d'assiéger, blocus
  - forme: obsidere
    langue: latin
    sens: s'asseoir devant une place, l'assiéger
    elements:
      - forme: ob
        sens: devant
      - forme: sedere
        sens: être assis
explication: >-
  En français, le mot a d'abord nommé le siège d'une place (1470), puis l'état
  d'une personne obsédée par un démon (1590). Depuis 1799, il désigne une idée
  ou une image qui s'impose à l'esprit sans relâche, et en psychiatrie (1866)
  une pensée involontaire et angoissante.
famille: [ obséder, obsédant, obsessionnel ]
themes: [ esprit, santé ]
tradition:
  lectures:
    - texte: "L'obsession, c'est le démon qui tourmente une personne du dehors, sans entrer dans son corps."
      citation: "L'obsession, au contraire, est lorsque le démon, sans entrer dans le corps d'une personne, la tourmente et l'obsède au dehors"
      sources:
        - ouvrage: dictionnaire-de-la-bible
          entree: "Obsession du démon"
          url: https://archive.org/download/dictionnairehis03calm/dictionnairehis03calm_djvu.txt
sources:
