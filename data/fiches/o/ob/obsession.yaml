    entree: obsession
  - ouvrage: lewis-short
    entree: obsessio
  - ouvrage: littre
    entree: obséder
  - ouvrage: lewis-short
    entree: obsideo
  - ouvrage: lewis-short
    entree: ob
  - ouvrage: tlfi
    entree: obséder
redaction:
