mot: obsession
nature: [ nom féminin ]
etymologie:
  - forme: obsessio
    langue: latin
    sens: action d'assiéger, blocus
  - forme: obsidere
    langue: latin
    sens: être installé devant, investir
explication: >-
  Obsidere, c'est assiéger : l'ennemi s'installe devant la ville sans y entrer.
  L'obsession désigne aujourd'hui une idée qui s'impose à l'esprit malgré lui, et le mot
  ne suppose plus d'assaillant extérieur.
famille: [ obséder, obsédant ]
renvois: [ demon, oppression ]
themes: [ esprit, religion ]
tradition:
  lectures:
    - texte: Le démon obsède en tourmentant du dehors, sans entrer dans le corps ;
        il possède quand il y est entré et ne le quitte plus.
      citation: L'obsession, au contraire, est lorsque le démon, sans entrer dans
        le corps d'une personne, la tourmente et l'obsède au dehors
      sources:
        - ouvrage: dictionnaire-de-la-bible
          entree: Obsession du démon
          url: https://archive.org/download/dictionnairehis03calm/dictionnairehis03calm_djvu.txt
sources:
  - ouvrage: littre
    entree: obsession
  - ouvrage: gaffiot
    entree: obsessio
  - ouvrage: gaffiot
    entree: obsideo
redaction:
  - par: IA
    detail: Claude Opus 5.5
statut: brouillon
