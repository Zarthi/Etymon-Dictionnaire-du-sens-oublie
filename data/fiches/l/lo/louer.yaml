mot: louer
nature: [ verbe ]
etymologie:
  - forme: locare
    langue: latin
    sens: placer
explication: >-
  Locare joignait déjà au sens de placer celui de donner à loyer. En français,
  louer a d'abord dit, vers 1100, l'engagement d'un homme contre un salaire,
  puis le fait d'obtenir contre paiement l'usage d'un bien ; il se dit
  aujourd'hui d'un bien, d'un service ou d'une place réservée.
famille: [ loyer, louage, location ]
themes: [ commerce ]
sources:
