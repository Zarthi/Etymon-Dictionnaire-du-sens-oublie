mot: louer
nature: [ verbe ]
etymologie:
  - forme: locare
    langue: latin
    sens: placer
  - forme: locus
    langue: latin
    sens: lieu
explication: >-
  Le latin locare signifie placer, mettre en un lieu ; il a pris le sens de donner à
  loyer, c'est-à-dire placer une chose chez un autre contre un prix. Le rapport avec le
  lieu ne s'entend plus dans louer.
famille: [ location, lieu ]
themes: [ commerce ]
sources:
  - ouvrage: littre
    entree: louer
redaction:
  - par: IA
    detail: Claude Opus 5.5
statut: brouillon
