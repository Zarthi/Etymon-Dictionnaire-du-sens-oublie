mot: rival
nature: [ nom ]
etymologie:
  - forme: rivalis
    langue: latin
    sens: riverain, celui qui use du même cours d'eau
explication: >-
  Rivalis désignait le riverain, celui qui a droit au même cours d'eau ; les
  riverains se disputaient l'eau. Le mot ne dit plus le voisinage, mais la
  concurrence et la prétention à un même objet.
