mot: responsable
nature: [ adjectif ]
etymologie:
  - forme: responsum
    langue: latin
    sens: réponse
  - forme: respondere
    langue: latin
    sens: répondre
explication: >-
  Responsable est celui qui doit rendre compte de ses actes et répondre de ceux
  des personnes dont il a la charge. Le mot s'est étendu à celui qui est cause
  de quelque chose, puis à celui qui est réfléchi et sérieux.
