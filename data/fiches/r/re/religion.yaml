mot: religion
etymon: religio
reconstruit: false
langue: latin
sens: attention scrupuleuse, scrupule
explication: >
  Le mot latin désignait d'abord le scrupule, l'attention inquiète portée à ce
  qui est sacré. Son origine est discutée : Cicéron le rattachait à relegere,
  reprendre et parcourir avec soin.
incertain: true
