mot: religion
nature: [ nom féminin ]
etymon: religio
reconstruit: false
langue: latin
sens: scrupule, attention portée au sacré
explication: >-
  Avant d'être une croyance ou une institution, la _religio_ est une
  disposition : le scrupule, l'attention inquiète portée au sacré. Son origine
  est discutée, et les Anciens hésitaient déjà ; Cicéron la tirait de
  _relegere_, reprendre avec soin.
incertain: true
racine: null
doublets: []
famille: []
themes: [ religion ]
sources:
