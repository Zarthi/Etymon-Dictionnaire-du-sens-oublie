    entree: religion
    url: https://www.littre.org/definition/religion
  - ouvrage: Gaffiot
    entree: religio
    url: https://gaffiot.fr/#religio
  - ouvrage: TLFi
    entree: religion
    url: https://www.cnrtl.fr/etymologie/religion
  - ouvrage: IA
    entree: Claude Opus 5.5
lecturesTraditionnelles:
  - texte: "Lactance fait venir _religio_ de _religare_, relier : l'homme est lié à
      Dieu par le lien de la piété. Il écarte expressément l'explication de
      Cicéron par _relegere_."
    auteur: Lactance
    sources:
      - ouvrage: Institutions divines
        entree: IV, 28, 3
        url: https://la.wikisource.org/wiki/Divinae_institutiones/Liber_IV
      - ouvrage: IA
        entree: Claude Opus 5.5
  - texte: "Augustin propose _religere_, choisir de nouveau : Dieu, que nous avions
      perdu par négligence, nous le choisissons à nouveau, et c'est de là que
      viendrait le mot."
    auteur: Augustin
    sources:
      - ouvrage: La Cité de Dieu
        entree: X, 3
        url: https://la.wikisource.org/wiki/De_civitate_Dei/Liber_X
      - ouvrage: IA
        entree: Claude Opus 5.5
  - texte: "Isidore réunit les deux voies : par la religion, nous relions nos âmes
      au seul Dieu pour le servir ; le mot viendrait aussi de _relegere_,
      compris comme choisir."
    auteur: Isidore de Séville
    sources:
      - ouvrage: Étymologies
        entree: VIII, 2, 2
        url: https://la.wikisource.org/wiki/Etymologiarum_libri_XX/Liber_VIII
      - ouvrage: IA
        entree: Claude Opus 5.5
statut: brouillon
historique: []
