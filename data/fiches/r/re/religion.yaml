mot: religion
nature: [ nom féminin ]
etymologie:
  - forme: religio
    langue: latin
    sens: attention scrupuleuse, scrupule
  - langue: latin
    alternatives:
      mode: debattue
      formes:
        - forme: relegere
          sens: reprendre avec soin
          elements:
            - forme: re-
              sens: de nouveau
            - forme: legere
              sens: recueillir
          selon: [ ciceron ]
        - forme: religare
          sens: attacher
          elements:
            - forme: re-
              sens: en arrière
            - forme: ligare
              sens: lier
          selon: [ lactance ]
explication: >-
  La religio est le scrupule qui fait hésiter, celui du juge devant un verdict comme celui
  du Romain devant les dieux. Le mot ne désignait pas une croyance, mais ce qui retient
  d'agir.
famille: [ religieux, religiosité, irréligion ]
themes: [ religion ]
sources:
  - ouvrage: littre
    entree: religion
  - ouvrage: gaffiot
    entree: religio
  - ouvrage: gaffiot
    entree: relego
  - ouvrage: gaffiot
    entree: lego
  - ouvrage: gaffiot
    entree: religo
  - ouvrage: gaffiot
    entree: ligo
  - ouvrage: la-nature-des-dieux
    entree: II, 72 (discours de Balbus)
    url: https://www.thelatinlibrary.com/cicero/nd2.shtml
  - ouvrage: tlfi
    entree: religion
redaction:
  - par: IA
    detail: Claude Opus 5.5
tradition:
  lectures:
    - texte: La religion est le lien de piété qui attache l'homme à Dieu, et non le
        soin des rites que Cicéron y voyait.
      citation: "hoc uinculo pietatis obstricti deo et religati sumus: unde ipsa
        religio nomen accepit, non ut Cicero interpretatus est a relegendo"
      hypothese: religare
      sources:
        - ouvrage: institutions-divines
          entree: IV, 28, 3
          url: https://la.wikisource.org/wiki/Divinae_institutiones/Liber_IV
    - texte: "Dieu, que nous avions perdu par négligence, nous le choisissons à
        nouveau : la religion est ce choix renouvelé."
      citation: hunc eligentes uel potius religentes (amiseramus enim neglegentes) —
        hunc ergo religentes, unde et religio dicta perhibetur
      sources:
        - ouvrage: la-cite-de-dieu
          entree: X, 3
          url: https://la.wikisource.org/wiki/De_civitate_Dei/Liber_X
    - texte: La religion attache nos âmes au seul Dieu pour le servir ; le mot serait
        pourtant formé sur relegere, compris comme « choisir ».
      citation: Religio appellata, quod per eam uni Deo religamus animas nostras ad
        cultum divinum vinculo serviendi. Quod verbum conpositum est a relegendo,
        id est eligendo
      hypothese: religare
      sources:
        - ouvrage: etymologies
          entree: VIII, 2, 2
          url: https://la.wikisource.org/wiki/Etymologiarum_libri_XX/Liber_VIII
statut: brouillon
