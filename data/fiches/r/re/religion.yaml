lectureTraditionnelle:
  texte: "Lactance fait venir religio de religare, relier : l'homme est lié à Dieu
    par le lien de la piété. Il écarte expressément l'explication de Cicéron par
    relegere."
  auteur: Lactance
  source: Institutions divines, IV, 28, 3
statut: brouillon
historique: []
