mot: répondre
nature: [ verbe ]
etymologie:
  - forme: respondere
    langue: latin
    sens: répondre, promettre en retour
    elements:
      - forme: re-
        sens: en retour
      - forme: spondere
        sens: promettre
explication: >-
  Respondere unissait l'idée de répondre et celle de promettre en retour : la
  réponse engageait. Le mot ne dit plus aujourd'hui que la parole donnée en
  retour à une question ou à un appel.
