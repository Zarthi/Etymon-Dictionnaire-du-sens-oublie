mot: image
nature: [ nom féminin ]
etymologie:
  - forme: image
    langue: français
  - forme: imago
    langue: latin
    sens: représentation, imitation, portrait ; représentation par la pensée,
      vision, songe
explication: >-
  Le latin imago disait la représentation sensible d'une personne, le portrait,
  et aussi l'évocation par la pensée. Le mot a gardé ce double sens, de la
  photographie au symbole.
famille: [ imaginer, imagination, imaginaire, imagerie ]
renvois: [ memoire ]
themes: [ esprit, savoir ]
tradition:
  lectures:
    - texte: L'homme est dit à l'image de Dieu selon ce par quoi il excelle sur les
        autres animaux, non selon le corps.
      citation: Ad secundum dicendum quod homo dicitur esse ad imaginem Dei, non
        secundum corpus, sed secundum id quo homo excellit alia animalia, unde,
        Gen.
      sources:
        - ouvrage: somme-theologique
          entree: Ia q. 3 a. 1 ad 2
          url: https://www.corpusthomisticum.org/sth1003.html
sources:
