mot: invention
nature: [ nom féminin ]
etymologie:
  - forme: inventio
    langue: latin
    sens: action de trouver
  - forme: invenire
    langue: latin
    sens: trouver
explication: >-
  Inventio nommait l'action de trouver ce qui existait déjà. Le mot a pris le
  sens de création de quelque chose de nouveau, alors qu'il disait d'abord une
  découverte.
