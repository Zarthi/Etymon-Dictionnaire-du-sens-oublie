explication: >-
  Insolent a d'abord dit ce qui sort de l'usage, l'insolite ; de
  l'extraordinaire on est passé à l'excessif, puis à l'effronté. Le mot ne garde
  aujourd'hui que l'arrogance et l'insulte.
