mot: indulgence
nature: [ nom féminin ]
etymologie:
  - forme: indulgentia
    langue: latin
    sens: bienveillance, faveur
explication: >-
  Le latin indulgentia nommait la bienveillance et la faveur ; l'Église en a
  fait la remise des peines dues au péché. Le mot dit aujourd'hui cette remise,
  ou la disposition à pardonner.
