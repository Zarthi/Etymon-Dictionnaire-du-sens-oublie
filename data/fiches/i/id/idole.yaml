mot: idole
nature: [ nom féminin ]
etymologie:
  - forme: idolum
    langue: latin
    sens: image, simulacre
  - forme: εἴδωλον
    langue: grec ancien
    sens: image, simulacre, fantôme
explication: >-
  Le grec nommait une image, un simulacre ; le mot a désigné l'image d'un dieu,
  puis toute personne ou chose intensément admirée. Il garde ces deux sens,
  l'image du dieu et l'objet de la vénération.
renvois: [ paien ]
themes: [ religion, société ]
tradition:
  lectures:
    - texte: L'idole est un simulacre façonné à figure humaine et consacré ; le mot
        vient de eidos, « forme ».
      citation: Idolum autem est simulacrum quod humana effigie factum et consecratum
        est, iuxta vocabuli interpretationem. EIDOS enim Graece formam sonat, et
        ab eo per diminutionem idolum deductum aeque apud nos formulam facit.
      sources:
        - ouvrage: etymologies
          entree: VIII, 11, 13
          url: https://la.wikisource.org/wiki/Etymologiarum_libri_XX/Liber_VIII
