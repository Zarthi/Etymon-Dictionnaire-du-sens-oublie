mot: utopie
nature: [ nom féminin ]
etymologie:
  - forme: Utopia
    langue: latin humaniste
    sens: ce qui ne se rencontre en aucun lieu
    forge:
      par: [ thomas-more ]
      date: "1516"
      ouvrage: utopia
  - langue: grec ancien
    alternatives:
      mode: jeu
      formes:
        - sens: en aucun lieu
          elements:
            - forme: οὐ
              sens: non
            - forme: τόπος
              sens: lieu
        - sens: lieu de félicité
          elements:
            - forme: εὖ
              sens: bien
            - forme: τόπος
              sens: lieu
explication: >-
  More nommait ainsi une île imaginaire au gouvernement idéal. En français, le
  mot a d'abord nommé un pays imaginaire chez Rabelais (1532), puis une idée
  jugée irréalisable (1821) ; il nomme aujourd'hui un plan de société idéale, ou
  ce qui relève du rêve.
themes: [ société ]
sources:
  - ouvrage: tlfi
    entree: utopie
  - ouvrage: littre
    entree: utopie
  - ouvrage: utopia
    entree: Hexastichon Anemolii
    url: https://archive.org/details/utopiaofsirthom00more
  - ouvrage: littre
    entree: eucharistie
  - ouvrage: bailly
    entree: τόπος
redaction:
  - par: IA
    detail: Claude Opus 5.5
    reflexion: élevée
statut: brouillon
