mot: franc
nature: [ adjectif ]
etymologie:
  - forme: Francus
    langue: latin médiéval
    sens: homme libre
  - forme: Franci
    langue: bas latin
    sens: les Francs
  - forme: "*frank"
    langue: francique
explication: >-
  Le nom du peuple qui avait conquis la Gaule a désigné l'homme libre dès la fin
  du VIe siècle. En français, franc a d'abord qualifié la condition libre (vers
  1050), puis la naissance noble (vers 1100) ; depuis 1611, il se dit de qui
  s'exprime ouvertement, sans artifice ni réticence.
famille: [ franchise, affranchir, franchement ]
renvois: [ ingenu ]
themes: [ morale ]
tradition:
  lectures:
    - texte: "Les Francs tiendraient leur nom d'un de leurs chefs ; selon d'autres, de la sauvagerie de leurs mœurs."
      citation: "Franci a quodam proprio duce vocari putantur. Alii eos a feritate morum nuncupatos existimant."
      sources:
        - ouvrage: etymologies
          entree: "IX, 2, 101"
          url: https://la.wikisource.org/wiki/Etymologiarum_libri_XX/Liber_IX
sources:
