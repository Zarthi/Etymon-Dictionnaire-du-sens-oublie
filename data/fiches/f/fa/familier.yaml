mot: familier
nature: [ adjectif ]
etymologie:
  - forme: familiaris
    langue: latin
    sens: qui fait partie de la maison, de la famille ; ami, intime
explication: >-
  Familiaris disait ce qui appartient à la maison, puis une personne de
  l'intimité. En français, familier a qualifié ce qui fait partie de la famille
  ou des proches, avant de dire ce qui est bien connu, habituel, et enfin ce qui
  manque de réserve.
famille: [ famille, familiarité, familiariser, familial ]
renvois: [ intime ]
