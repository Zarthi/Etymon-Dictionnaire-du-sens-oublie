mot: folie
nature: [ nom féminin ]
etymologie:
  - forme: fou
    langue: français
    sens: fou, déraisonnable
  - forme: follis
    langue: latin
    sens: soufflet, outre gonflée
explication: >-
  Folie est le nom de l'état de fou. Fou vient de follis, le soufflet, l'outre
  gonflée : l'image d'une tête enflée et vide a donné l'idée de déraison. Le mot
  a gardé l'image du vide, mais il dit aujourd'hui le trouble de l'esprit.
