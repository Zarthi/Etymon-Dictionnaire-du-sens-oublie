mot: naître
nature: [ verbe ]
etymologie:
  - forme: nascere
    langue: latin
  - forme: nasci
    langue: latin
    sens: être engendré, naître
explication: >-
  Nasci se disait de l'enfant engendré par son père comme de celui que sa mère
  met au monde. Naître nomme la venue au monde, et dès le XIIe siècle ce qui
  commence à paraître : le jour qui point, un sentiment, un fleuve à sa source.
famille: [ naissance, natal, natif, naïf, nature ]
themes: [ famille ]
