mot: guide
nature: [ nom masculin ]
etymologie:
  - forme: guida
    langue: occitan
    sens: celui qui conduit
  - forme: guidar
    langue: occitan
    sens: conduire
  - forme: "*widan"
    langue: germanique
    sens: attacher, atteler
explication: >-
  Guida, en ancien provençal, nommait celui qui montre le chemin. Le mot a
