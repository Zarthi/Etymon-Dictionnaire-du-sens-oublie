mot: guérir
nature: [ verbe ]
etymologie:
  - forme: guarir
    langue: ancien français
    sens: garantir, protéger
  - forme: "*warjan"
    langue: francique
    sens: défendre, protéger
explication: >-
  *Warjan disait défendre et protéger ; guarir a gardé ce sens avant de dire
  recouvrer la santé. Le mot ne dit plus aujourd'hui que la guérison.
famille: [ guérison, guérisseur, guérissable, inguérissable ]
themes: [ santé ]
