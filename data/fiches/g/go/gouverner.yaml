mot: gouverner
nature: [ verbe ]
etymologie:
  - forme: gubernare
    langue: latin
    sens: diriger un navire ; diriger, gouverner
  - forme: κυβερνάω
    langue: grec ancien
    sens: diriger un navire
explication: >-
  Le latin gubernare, emprunté au grec κυβερνάω, disait d'abord diriger un
  navire, puis diriger les hommes. Le français a retenu les deux sens : le
  politique dès le XIe siècle, le maritime dans gouvernail.
famille: [ gouvernement, gouvernail, gouverneur ]
renvois: [ dominer ]
