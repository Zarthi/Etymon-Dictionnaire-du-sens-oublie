mot: défendre
nature: [ verbe ]
etymologie:
  - forme: defendere
    langue: latin
    sens: repousser, écarter
explication: >-
  Dès la Chanson de Roland, vers 1100, défendre veut dire à la fois protéger
  quelqu'un, tenir un lieu contre l'ennemi et interdire de faire. Prendre la
  défense d'un accusé en jugement n'est attesté qu'en 1559.
famille: [ défense, défenseur, défendeur, offense, manifeste ]
themes: [ droit, guerre ]
