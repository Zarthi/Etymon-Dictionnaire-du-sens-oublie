explication: >-
  Dégoût est le déverbal de dégoûter, formé sur goût avec le préfixe dé-. Il a
  nommé d'abord le manque d'appétit (1595), puis, avant 1630, le déplaisir et le
  chagrin, et en 1636 l'aversion. L'usage courant garde l'aversion et la
  répugnance pour un aliment, et le manque d'appétit.
