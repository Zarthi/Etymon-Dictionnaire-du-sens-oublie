mot: désinvolte
nature: [ adjectif ]
etymologie:
  - forme: disinvolto
    langue: italien
    sens: dégagé, sans embarras
    elements:
      - forme: dis-
        langue: italien
        sens: négation
      - forme: involto
        langue: italien
        sens: enveloppé, embarrassé
explication: >-
  En italien, disinvolto dit proprement ce qui n'est pas enveloppé, donc ce qui
  est dégagé. Le français a pris le mot pour une aisance d'allure, parfois trop
  libre.
