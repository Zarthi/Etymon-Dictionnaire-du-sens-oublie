mot: désespoir
nature: [ nom masculin ]
etymologie:
  - forme: desesper
    langue: ancien français
    sens: perte de l'espoir
    elements:
      - forme: dé-
        langue: français
        sens: priver de
      - forme: espoir
        langue: ancien français
