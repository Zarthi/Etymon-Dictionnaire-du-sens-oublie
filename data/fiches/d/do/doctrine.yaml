mot: doctrine
nature: [ nom féminin ]
etymologie:
  - forme: doctrina
    langue: latin
    sens: enseignement
explication: >-
  Le latin doctrina nommait l'enseignement ; le mot a désigné le contenu de cet
  enseignement, puis un corps de thèses. Il ne dit plus aujourd'hui qu'un
  ensemble de principes, souvent religieux ou politique.
