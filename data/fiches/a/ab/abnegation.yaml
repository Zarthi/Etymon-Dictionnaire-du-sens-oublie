mot: abnégation
etymon: abnegatio
reconstruit: false
langue: latin ecclésiastique
sens: refus, reniement
explication: >
  Le mot vient du renoncement à soi que demande l'Évangile : abneget semetipsum,
  « qu'il se renie lui-même ». L'abnégation est d'abord un refus opposé à soi,
  avant d'être un simple dévouement.
