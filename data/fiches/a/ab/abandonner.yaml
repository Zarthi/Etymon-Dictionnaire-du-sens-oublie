mot: abandonner
etymon: à bandon
reconstruit: false
langue: ancien français
sens: au pouvoir de, à la discrétion de
explication: >
  Mettre à bandon, c'était laisser une chose au pouvoir d'un autre, à sa
  discrétion. Abandonner, ce n'est pas d'abord délaisser, mais remettre entre
  d'autres mains.
