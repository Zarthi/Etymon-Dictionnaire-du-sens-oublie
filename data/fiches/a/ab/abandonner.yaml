explication: >-
  Abandonner, c'était d'abord mettre à disposition, laisser au pouvoir de : le
  cheval abandonné est lâché, la bride sur le cou, et s'abandonner au danger,
  c'est s'y exposer tout entier. Le mot a perdu cette force ; abandonner
  quelqu'un, aujourd'hui, c'est le délaisser.
