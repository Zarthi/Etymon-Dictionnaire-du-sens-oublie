mot: absurde
nature: [ adjectif ]
etymologie:
  - forme: absurdus
    langue: latin
    sens: discordant, qui sonne faux
explication: >
  L'absurde est d'abord une fausse note : ab-surdus, ce qui rend un son sourd,
  dissonant. Une chose absurde ne choque pas seulement la raison, elle écorche
  l'oreille.
famille: [ sourd ]
themes: [ esprit, parole ]
sources:
  - ouvrage: littre
    entree: absurde
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
