mot: absoudre
nature: [ verbe ]
etymologie:
  - forme: absolvere
    langue: latin
    sens: délier, dégager
explication: >
  Absoudre, c'est délier. Le juge qui absout détache l'accusé de sa cause ; le
  prêtre qui absout dénoue le lien de la faute. Le pardon garde ici la forme
  d'un nœud défait.
famille: [ absolu, dissoudre, résoudre ]
themes: [ droit, religion, morale ]
sources:
  - ouvrage: littre
    entree: absoudre
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
