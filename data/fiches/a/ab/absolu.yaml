mot: absolu
nature: [ adjectif ]
etymologie:
  - forme: absolutus
    langue: latin
    sens: délié, détaché, achevé
explication: >
  L'absolu est ce qui a été délié : absolvere, détacher. Est absolu ce qui ne
  dépend de rien, ce que ne retient aucun lien, aucune condition.
famille: [ absoudre, dissoudre, soluble ]
themes: [ esprit, savoir ]
sources:
  - ouvrage: littre
    entree: absolu
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
