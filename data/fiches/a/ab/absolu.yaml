mot: absolu
etymon: absolutus
reconstruit: false
langue: latin
sens: délié, détaché, achevé
explication: >
  L'absolu est ce qui a été délié : absolvere, détacher. Est absolu ce qui ne
  dépend de rien, ce que ne retient aucun lien, aucune condition.
