mot: atome
nature: [ nom masculin ]
etymologie:
  - forme: atomus
    langue: latin
    sens: corpuscule indivisible
  - forme: ἄτομος
    langue: grec ancien
    sens: qu'on ne peut couper
explication: >
  Atomos, c'est ce qu'on ne peut couper : temnein, trancher. L'atome des
  philosophes grecs est la particule ultime, indivisible par définition. Le
  nôtre se fend : le mot a survécu à son sens.
famille: [ anatomie, tome ]
themes: [ savoir, nature ]
sources:
  - ouvrage: littre
    entree: atome
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
