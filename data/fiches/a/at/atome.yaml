mot: atome
nature: [nom masculin]
etymon: atomus
reconstruit: false
langue: latin
sens: corpuscule indivisible
explication: >
  Atomos, c'est ce qu'on ne peut couper : temnein, trancher. L'atome des
  philosophes grecs est la particule ultime, indivisible par définition. Le
  nôtre se fend : le mot a survécu à son sens.
