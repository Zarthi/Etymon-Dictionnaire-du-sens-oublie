mot: attention
nature: [ nom féminin ]
etymologie:
  - forme: attentio
    langue: latin
    sens: action de tendre l'esprit vers
explication: >
  Attendere, c'est tendre vers. L'attention est une tension de l'esprit dirigée
  vers une chose, comme on tend un arc. Être attentif, c'est être tendu vers.
famille: [ tendre, attendre, tension, intention ]
themes: [ esprit, savoir ]
