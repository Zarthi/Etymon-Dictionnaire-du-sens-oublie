mot: affection
nature: [ nom féminin ]
etymon: affectio
langue: latin
sens: disposition produite par une influence
explication: >
  Afficere, c'est agir sur. L'affection est l'état de ce qui a été touché,
  modifié : d'où l'affection du médecin, la maladie, et l'affection du cœur, la
  tendresse. Dans les deux cas, on a été atteint.
