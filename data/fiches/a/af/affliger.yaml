mot: affliger
nature: [ verbe ]
etymon: affligere
langue: latin
sens: abattre, jeter à terre
explication: >
  Affligere, c'est frapper contre, jeter au sol. L'affligé est un homme abattu
  au sens propre, renversé par le coup. Le chagrin a gardé la posture du corps
  qui tombe.
famille: [ affliction, infliger, conflit ]
