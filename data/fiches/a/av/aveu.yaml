mot: aveu
nature: [ nom masculin ]
etymologie:
  - forme: advocare
    langue: latin
    sens: appeler auprès de soi, prendre pour garant
explication: >
  Avouer, c'est d'abord appeler quelqu'un pour garant : le vassal avoue un
  seigneur, le reconnaît pour maître. Avouer une faute, c'est encore la
  reconnaître pour sienne, s'en porter garant.
famille: [ avouer, avocat, désaveu ]
themes: [ droit, morale, parole ]
sources:
