mot: aveugle
nature: [ adjectif, nom ]
etymologie:
  - forme: "*aboculus"
    langue: latin populaire
    sens: privé d'yeux
explication: >
  Ab oculis, sans yeux : l'aveugle est celui à qui les yeux ont été ôtés. Le
  latin classique disait caecus ; le mot populaire dit la privation, non
  l'obscurité.
famille: [ oculaire, œil ]
themes: [ corps, santé ]
sources:
  - ouvrage: littre
    entree: aveugle
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
