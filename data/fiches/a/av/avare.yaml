mot: avare
nature: [ adjectif, nom ]
etymologie:
  - forme: avarus
    langue: latin
    sens: avide, qui désire ardemment
explication: >
  Avere, c'est désirer ardemment ; l'avarus est un homme avide. L'avare n'est
  pas d'abord celui qui retient, mais celui qui veut toujours plus. La rétention
  n'est que l'envers de l'appétit.
famille: [ avide, avidité ]
themes: [ morale, argent ]
sources:
  - ouvrage: littre
    entree: avare
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
