mot: avocat
nature: [ nom masculin ]
etymologie:
  - forme: advocatus
    langue: latin
    sens: appelé auprès, appelé en aide
explication: >
  L'avocat est celui qu'on appelle à ses côtés : ad-vocare. Il est d'abord l'ami
  qu'on fait venir pour vous soutenir devant le juge, avant d'être un métier.
famille: [ aveu, avouer, vocation, voix ]
themes: [ droit, parole ]
sources:
  - ouvrage: littre
    entree: avocat
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
