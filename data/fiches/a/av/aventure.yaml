mot: aventure
etymon: "*adventura"
reconstruit: true
langue: latin populaire
sens: ce qui doit arriver
explication: >
  Adventura, ce sont les choses à venir, ce qui doit advenir. L'aventure est
  d'abord le sort, ce que l'avenir réserve ; d'où la bonne aventure qu'on dit,
  et le hasard que l'on court.
