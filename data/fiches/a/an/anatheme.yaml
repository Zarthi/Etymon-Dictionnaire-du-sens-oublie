mot: anathème
etymon: anathema
reconstruit: false
langue: latin ecclésiastique
sens: chose vouée à Dieu, puis chose maudite
explication: >
  L'anathème est d'abord une offrande suspendue dans un temple, ce qui est mis à
  part pour le dieu. Ce qui est voué à Dieu est retiré aux hommes : le mot a
  glissé de l'offrande à la malédiction.
