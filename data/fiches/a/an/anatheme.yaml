mot: anathème
nature: [ nom masculin ]
etymologie:
  - forme: anathema
    langue: latin
    sens: chose vouée, exécration
  - forme: ἀνάθεμα
    langue: grec ancien
    sens: offrande votive ; malédiction
explication: >-
  Le grec nommait une offrande vouée aux dieux ; le même mot en est venu à
  désigner ce qui est maudit, puis la malédiction elle-même. Il ne dit plus
  aujourd'hui qu'une réprobation solennelle.
