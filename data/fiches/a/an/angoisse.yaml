mot: angoisse
etymon: angustia
reconstruit: false
langue: latin
sens: étroitesse, passage resserré
explication: >
  Angustia est l'étroitesse, le défilé où l'on ne passe qu'à peine. L'angoisse
  est le sentiment d'être à l'étroit : la gorge se serre, la poitrine se
  resserre. Le corps y dit ce que le mot dit.
