mot: ancêtre
nature: [ nom ]
etymon: antecessor
langue: latin
sens: celui qui marche devant
explication: >
  Antecedere, c'est marcher devant. L'ancêtre est celui qui nous précède sur le
  chemin, non seulement dans le temps : il ouvre la voie, et nous marchons dans
  ses pas.
famille: [ prédécesseur, céder, procéder ]
themes: [ famille, temps ]
sources:
  - ouvrage: Littré
    entree: ancêtres
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
