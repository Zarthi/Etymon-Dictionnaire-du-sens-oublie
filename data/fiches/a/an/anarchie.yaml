mot: anarchie
nature: [ nom féminin ]
etymologie:
  - forme: ἀναρχία
    langue: grec ancien
    sens: absence de chef, de commandement
explication: >
  Arkhē est à la fois le commencement et le commandement ; l'anarchie est
  l'absence de l'un et de l'autre. Le mot dit un vide de principe, avant de
  nommer une doctrine.
famille: [ monarchie, hiérarchie, archétype ]
themes: [ société, droit ]
sources:
  - ouvrage: littre
    entree: anarchie
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
