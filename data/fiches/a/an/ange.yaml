mot: ange
nature: [ nom masculin ]
etymologie:
  - forme: angelus
    langue: latin ecclésiastique
    sens: messager
explication: >
  L'ange est un messager : angelos, celui qui porte une nouvelle. Le mot ne dit
  rien de sa nature, seulement sa fonction : il est envoyé, il annonce.
  L'Évangile, la bonne nouvelle, porte la même racine.
famille: [ évangile, archange ]
themes: [ religion, parole ]
sources:
  - ouvrage: littre
    entree: ange
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
