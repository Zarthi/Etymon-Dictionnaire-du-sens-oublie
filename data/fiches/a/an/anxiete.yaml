mot: anxiété
etymon: anxietas
reconstruit: false
langue: latin
sens: resserrement, oppression
explication: >
  Angere, c'est serrer, étrangler. L'anxieux est un homme serré, oppressé, comme
  l'angoissé est un homme à l'étroit. Les deux mots viennent du même geste qui
  prend à la gorge.
