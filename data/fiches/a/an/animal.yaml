mot: animal
nature: [ nom masculin ]
etymon: animal
langue: latin
sens: être animé, être vivant
explication: >
  Animal est ce qui a une anima, un souffle : tout être vivant qui respire,
  l'homme compris. Le mot n'oppose pas la bête à l'homme, il les réunit dans le
  souffle.
