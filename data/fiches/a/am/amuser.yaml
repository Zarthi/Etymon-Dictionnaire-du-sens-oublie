mot: amuser
nature: [ verbe ]
etymon: muser
langue: ancien français
sens: rester le museau en l'air, s'attarder
explication: >
  Amuser, c'est faire muser : tenir quelqu'un le museau levé, à perdre son
  temps. Le sens ancien est tromper, retenir par de faux prétextes. L'amusement
  fut d'abord une diversion qui détourne.
incertain: true
famille: [ muser, musarder, museau ]
themes: [ émotions, parole ]
sources:
