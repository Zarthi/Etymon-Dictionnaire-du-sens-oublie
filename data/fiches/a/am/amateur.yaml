mot: amateur
nature: [nom masculin]
etymon: amator
reconstruit: false
langue: latin
sens: celui qui aime
explication: >
  L'amateur est celui qui aime : amator. L'amateur d'art aime les œuvres ; c'est
  ensuite qu'on l'a opposé au professionnel, et qu'il a pris un air de
  dilettante. Le sens premier était un éloge.
