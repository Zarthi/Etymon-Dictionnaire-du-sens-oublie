mot: âme
etymon: anima
reconstruit: false
langue: latin
sens: souffle, air, principe de vie
explication: >
  Anima est le souffle, le vent, l'air que l'on respire. L'âme est ce qui anime,
  ce qui fait respirer : un être animé est un être qui a un souffle. Rendre
  l'âme, c'est rendre le dernier souffle.
