mot: ambition
etymon: ambitio
reconstruit: false
langue: latin
sens: action d'aller autour, brigue des suffrages
explication: >
  Ambire, c'est aller autour. L'ambitio romaine est la tournée du candidat qui
  sollicite les votes. L'ambition est d'abord une démarche, le tour que l'on
  fait pour obtenir une charge.
