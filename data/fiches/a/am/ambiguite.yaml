mot: ambiguïté
nature: [ nom féminin ]
etymon: ambiguitas
langue: latin
sens: incertitude de ce qui va des deux côtés
explication: >
  Ambigere, c'est pousser des deux côtés à la fois : ambi, de part et d'autre,
  et agere, mener. L'ambigu tire dans deux directions ; on ne sait de quel côté
  il ira.
famille: [ ambiant, ambidextre ]
themes: [ parole, esprit ]
sources:
  - ouvrage: Littré
    entree: ambiguité
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
