mot: agonie
etymon: agonia
reconstruit: false
langue: latin ecclésiastique
sens: angoisse, lutte intérieure
explication: >
  L'agonie est un combat : agōn, la lutte des athlètes, puis l'angoisse du
  Christ à Gethsémani. Le mot ne désigne pas l'affaiblissement final, mais le
  dernier corps à corps.
