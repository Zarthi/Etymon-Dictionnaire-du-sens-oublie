mot: agonie
nature: [ nom féminin ]
etymologie:
  - forme: agonia
    langue: latin ecclésiastique
    sens: angoisse, lutte intérieure
  - forme: ἀγών
    langue: grec ancien
    sens: lutte, combat
explication: >
  L'agonie est un combat : agōn, la lutte des athlètes, puis l'angoisse du
  Christ à Gethsémani. Le mot ne désigne pas l'affaiblissement final, mais le
  dernier corps à corps.
famille: [ antagoniste, protagoniste ]
themes: [ corps, santé, religion ]
sources:
  - ouvrage: littre
    entree: agonie
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
