mot: agir
nature: [ verbe ]
etymon: agere
reconstruit: false
langue: latin
sens: pousser devant soi, mener
explication: >
  Agere, c'est pousser devant soi : mener un troupeau, conduire un char. Agir,
  c'est faire avancer quelque chose, et l'agent est celui qui mène. L'action est
  une poussée avant d'être un fait.
