mot: apathie
nature: [ nom féminin ]
etymologie:
  - forme: ἀπάθεια
    langue: grec ancien
    sens: absence de passion, impassibilité
explication: >
  Pour les stoïciens, l'apatheia est une vertu : l'âme que les passions
  n'atteignent plus. Nous en avons fait un défaut, l'absence d'énergie. L'idéal
  du sage est devenu un symptôme.
famille: [ pathétique, sympathie, passion ]
themes: [ morale, émotions ]
sources:
  - ouvrage: littre
    entree: apathie
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
