mot: apathie
nature: [nom féminin]
etymon: apátheia
graphie: ἀπάθεια
reconstruit: false
langue: grec ancien
sens: absence de passion, impassibilité
explication: >
  Pour les stoïciens, l'apatheia est une vertu : l'âme que les passions
  n'atteignent plus. Nous en avons fait un défaut, l'absence d'énergie. L'idéal
  du sage est devenu un symptôme.
