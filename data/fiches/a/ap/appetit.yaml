mot: appétit
etymon: appetitus
reconstruit: false
langue: latin
sens: désir, tendance vers
explication: >
  Appetere, c'est chercher à atteindre. L'appétit est toute tendance vers une
  chose : les scolastiques parlent d'appétit sensible et d'appétit rationnel, la
  volonté. Nous l'avons réduit à la faim.
