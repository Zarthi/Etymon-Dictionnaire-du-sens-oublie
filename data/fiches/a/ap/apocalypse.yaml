mot: apocalypse
nature: [ nom féminin ]
etymologie:
  - forme: apocalypsis
    langue: latin
    sens: révélation
  - forme: ἀποκάλυψις
    langue: grec ancien
    sens: action de découvrir, révélation
explication: >-
  Le grec nommait un dévoilement, la révélation de Dieu ; le titre du livre de
  Jean a lié le mot à la fin du monde. L'usage courant retient surtout la
  catastrophe.
