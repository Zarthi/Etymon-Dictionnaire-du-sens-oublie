mot: apprendre
nature: [ verbe ]
etymologie:
  - forme: apprehendere
    langue: latin
    sens: prendre, saisir
    elements:
      - forme: ad
        sens: vers, à
      - forme: prehendere
        sens: prendre, saisir
explication: >-
  Le latin apprehendere disait la prise, « saisir » ; le bas latin l'a employé
  pour « saisir par l'esprit ». Le français n'a gardé que cette saisie
  intellectuelle : étudier, recevoir un enseignement, puis être informé de
  quelque chose.
