mot: apprendre
nature: [ verbe ]
etymon: apprehendere
reconstruit: false
langue: latin
sens: saisir, prendre
explication: >
  Apprendre, c'est prendre : apprehendere, saisir avec la main. Ce qu'on
  apprend, on s'en empare, on le tient. Appréhender, forme savante du même mot,
  a gardé la prise, et y a ajouté la crainte.
