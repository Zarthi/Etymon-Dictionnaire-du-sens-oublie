mot: apôtre
nature: [ nom masculin ]
etymologie:
  - forme: apostolus
    langue: latin ecclésiastique
    sens: envoyé
explication: >
  Apostellein, c'est envoyer au loin. L'apôtre est un envoyé, chargé d'une
  mission ; le mot dit le départ et le mandat, non la sainteté.
