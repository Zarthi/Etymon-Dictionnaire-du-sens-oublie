mot: aumône
nature: [ nom féminin ]
etymon: eleemosyna
langue: latin ecclésiastique
sens: pitié, compassion
explication: >
  L'aumône est la pitié elle-même : eleos, la compassion. Le don n'en est que la
  conséquence. Le mot désignait le sentiment avant la pièce qu'on tend.
origine:
  formes:
    - forme: eleēmosýnē
      graphie: ἐλεημοσύνη
      langue: grec ancien
      sens: pitié, miséricorde
famille: [ aumônier ]
themes: [ morale, religion, argent ]
sources:
  - ouvrage: Littré
    entree: aumône
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
