langue: latin
sens: présage tiré du vol des oiseaux
explication: >
  L'augure romain observe les oiseaux pour y lire la volonté des dieux. Un
  événement de bon augure est un vol favorable ; inaugurer, c'est ouvrir un lieu
  après avoir pris les augures.
