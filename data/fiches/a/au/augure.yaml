mot: augure
nature: [ nom masculin ]
etymologie:
  - forme: augurium
    langue: latin
    sens: présage tiré du vol des oiseaux
explication: >
  L'augure romain observe les oiseaux pour y lire la volonté des dieux. Un
  événement de bon augure est un vol favorable ; inaugurer, c'est ouvrir un lieu
  après avoir pris les augures.
famille: [ inaugurer, augural ]
themes: [ religion, savoir ]
sources:
  - ouvrage: littre
    entree: augure
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
