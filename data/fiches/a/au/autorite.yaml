mot: autorité
nature: [ nom féminin ]
etymon: auctoritas
langue: latin
sens: garantie, crédit de celui qui fonde
explication: >
  L'auctor est celui qui fait croître, qui fonde et garantit : augere,
  augmenter. L'autorité est le crédit de celui qui répond d'une chose ; la
  contrainte n'y est pas.
