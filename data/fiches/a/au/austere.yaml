mot: austère
nature: [ adjectif ]
etymologie:
  - forme: austerus
    langue: latin
    sens: âpre au goût, rude
  - forme: αὐστηρός
    langue: grec ancien
    sens: qui assèche la langue
explication: >
  Austērós se dit d'un vin âpre, qui dessèche la bouche. L'austère est d'abord
  une saveur, rude et sans douceur ; la morale a emprunté le mot au palais.
famille: [ austérité ]
themes: [ morale, nourriture ]
sources:
  - ouvrage: littre
    entree: austère
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
