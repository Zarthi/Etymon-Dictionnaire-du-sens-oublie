mot: adorer
nature: [ verbe ]
etymologie:
  - forme: adorare
    langue: latin
    sens: adresser une prière, parler à
explication: >
  Adorer, c'est parler à : ad-orare, adresser sa parole, sa prière. On adore
  d'abord en s'adressant à quelqu'un, avant que le mot ne dise l'amour éperdu.
famille: [ oraison, orateur, oracle ]
themes: [ religion, parole ]
sources:
  - ouvrage: littre
    entree: adorer
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
