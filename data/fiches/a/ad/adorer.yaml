mot: adorer
nature: [ verbe ]
etymologie:
  - forme: adorare
    langue: latin
    sens: rendre un culte, adresser une prière
    elements:
      - forme: ad
        sens: vers, à
      - forme: orare
        sens: prier, parler
explication: >-
  Adorare supposait un dieu : c'était lui adresser une prière. Adorer s'est
  étendu aux êtres aimés, puis aux choses qu'on aime avec passion.
famille: [ adoration, adorable ]
renvois: [ aimer ]
themes: [ religion, émotions ]
sources:
  - ouvrage: tlfi
    entree: adorer
  - ouvrage: littre
    entree: adorer
redaction:
  - par: IA
    detail: DeepSeek Flash Latest
    reflexion: élevée
tradition:
  lectures:
    - texte: >-
        L'adoration rend à celui qu'on adore la révérence qui lui est due ; aussi est-elle
        l'acte de la religion, par lequel Dieu est adoré.
      citation: >-
        Unde adoratio qua Deus adoratur est religionis actus.
      sources:
        - ouvrage: somme-theologique
          entree: "IIa-IIae, q. 84, a. 1, co."
          url: https://www.corpusthomisticum.org/sth3082.html
statut: brouillon
