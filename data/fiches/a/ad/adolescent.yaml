mot: adolescent
nature: [nom, adjectif]
etymon: adolescens
reconstruit: false
langue: latin
sens: qui est en train de grandir
explication: >
  Adolescere, c'est croître. L'adolescent est celui qui grandit encore ;
  l'adulte, adultus, celui qui a fini de grandir. Les deux mots sont les deux
  temps d'un même verbe.
