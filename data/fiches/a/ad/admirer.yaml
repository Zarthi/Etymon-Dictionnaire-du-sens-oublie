mot: admirer
etymon: admirari
reconstruit: false
langue: latin
sens: s'étonner de, être frappé de surprise
explication: >
  Admirer, c'est d'abord s'étonner : mirari, regarder avec surprise. Descartes
  fait de l'admiration la première des passions, le saisissement devant ce qui
  est nouveau. Le mot a glissé vers l'éloge.
