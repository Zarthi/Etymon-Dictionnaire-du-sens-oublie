mot: adresse
nature: [ nom féminin ]
etymon: "*directiare"
langue: latin populaire
sens: rendre droit, diriger
explication: >
  L'adresse, celle de la lettre comme celle de la main, vient de dresser :
  directiare, mettre droit. Adresser, c'est diriger tout droit vers ; l'adresse
  du geste est un mouvement qui va droit au but.
