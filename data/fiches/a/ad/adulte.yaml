mot: adulte
nature: [ nom, adjectif ]
etymologie:
  - forme: adultus
    langue: latin
    sens: qui a fini de grandir
explication: >
  Adultus est le participe passé d'adolescere, croître : l'adulte a achevé sa
  croissance. Le mot ne dit rien de la maturité, seulement que la poussée est
  terminée.
famille: [ adolescent ]
themes: [ famille, corps, temps ]
sources:
