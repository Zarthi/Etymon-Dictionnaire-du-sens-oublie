mot: accord
nature: [ nom masculin ]
etymon: "*accordare"
reconstruit: true
langue: latin populaire
sens: mettre cœur à cœur
explication: >
  S'accorder, c'est d'abord mettre les cœurs ensemble : cor, cordis. L'accord
  des personnes, avant celui des instruments, est une entente de cœur.
