mot: accueillir
nature: [ verbe ]
etymologie:
  - forme: "*accolligere"
    langue: latin populaire
    sens: recueillir, rassembler auprès de soi
explication: >
  Accueillir, c'est cueillir vers soi : accolligere, recueillir, rassembler.
  Celui qu'on accueille est ramassé, mis à l'abri, comme une récolte qu'on
  rentre.
famille: [ cueillir, recueillir, collecte ]
themes: [ maison, société ]
sources:
  - ouvrage: littre
    entree: accueillir
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
