mot: accueillir
nature: [ verbe ]
etymon: "*accolligere"
reconstruit: true
langue: latin populaire
sens: recueillir, rassembler auprès de soi
explication: >
  Accueillir, c'est cueillir vers soi : accolligere, recueillir, rassembler.
  Celui qu'on accueille est ramassé, mis à l'abri, comme une récolte qu'on
  rentre.
