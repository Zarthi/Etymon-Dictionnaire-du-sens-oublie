mot: accuser
etymon: accusare
reconstruit: false
langue: latin
sens: mettre en cause, appeler en justice
explication: >
  Accuser, c'est mettre en cause : causa, l'affaire, le procès. L'accusé est
  celui qu'on appelle devant la cause ; excuser, c'est l'en faire sortir.
