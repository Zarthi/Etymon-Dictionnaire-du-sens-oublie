mot: accident
nature: [ nom masculin ]
etymon: accidens
langue: latin
sens: ce qui survient, ce qui tombe sur
explication: >
  Accidere, c'est tomber sur. L'accident est ce qui arrive sans être attendu,
  heureux ou non ; la philosophie en garde le sens de ce qui s'ajoute à une
  chose sans tenir à son essence.
famille: [ incident, coïncider, chute ]
themes: [ esprit, savoir, temps ]
sources:
  - ouvrage: Littré
    entree: accident
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
