mot: artifice
nature: [ nom masculin ]
etymologie:
  - forme: artificium
    langue: latin
    sens: métier, habileté, ouvrage d'art
explication: >
  L'artifice est l'œuvre de l'art, ce que l'habileté humaine produit. Le mot n'a
  d'abord rien de trompeur : le feu d'artifice en garde le sens d'ouvrage
  savant. La ruse est venue ensuite.
famille: [ art, artisan, artificiel ]
themes: [ travail, savoir ]
sources:
  - ouvrage: littre
    entree: artifice
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
