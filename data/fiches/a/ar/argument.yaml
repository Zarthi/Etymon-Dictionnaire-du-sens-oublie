mot: argument
nature: [ nom masculin ]
etymon: argumentum
reconstruit: false
langue: latin
sens: ce qui fait voir clair, preuve
explication: >
  Arguere, c'est faire voir, montrer clairement. L'argument est ce qui éclaire
  une question, la preuve qu'on apporte. Il ne désigne pas la dispute, mais ce
  qui devrait y mettre fin.
