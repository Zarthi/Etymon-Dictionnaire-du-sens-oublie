mot: aristocratie
etymon: aristokratía
reconstruit: false
langue: grec ancien
sens: gouvernement des meilleurs
explication: >
  Aristos est le meilleur ; l'aristocratie est le pouvoir des meilleurs, par
  opposition à celui du peuple ou d'un seul. Le mot désigne un idéal avant de
  nommer une classe héréditaire.
