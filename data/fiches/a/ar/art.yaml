mot: art
nature: [ nom masculin ]
etymon: ars
langue: latin
sens: habileté acquise, métier
explication: >
  Ars est le savoir-faire, la manière de faire une chose : le métier du forgeron
  comme celui du poète. Les beaux-arts sont une invention récente ; l'art fut
  longtemps tout ce que l'homme sait faire, face à la nature.
famille: [ artisan, artifice, artiste ]
themes: [ travail, savoir ]
sources:
