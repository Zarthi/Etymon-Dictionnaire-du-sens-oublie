mot: argent
nature: [ nom masculin ]
etymologie:
  - forme: argentum
    langue: latin
    sens: le métal argent, blanc et brillant
explication: >
  L'argent est d'abord le métal, blanc et brillant, dont on frappait les pièces.
  La monnaie a pris le nom de sa matière : nous disons encore argent pour ce qui
  n'en contient plus une once.
famille: [ argenté, argentin ]
themes: [ argent, commerce, nature ]
sources:
  - ouvrage: littre
    entree: argent
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
