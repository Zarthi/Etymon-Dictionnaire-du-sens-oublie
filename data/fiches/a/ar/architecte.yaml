mot: architecte
nature: [ nom ]
etymon: architectus
langue: latin
sens: maître d'œuvre, constructeur
explication: >
  Le tektōn grec est le charpentier, l'artisan qui assemble ; l'architecte est
  celui qui commande aux charpentiers. Le mot dit un métier de chantier, avant
  l'art du dessin.
