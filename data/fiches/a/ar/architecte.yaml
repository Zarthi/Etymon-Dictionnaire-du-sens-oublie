mot: architecte
nature: [ nom ]
etymologie:
  - forme: architectus
    langue: latin
    sens: maître d'œuvre, constructeur
  - forme: ἀρχιτέκτων
    langue: grec ancien
    sens: chef des charpentiers
explication: >
  Le tektōn grec est le charpentier, l'artisan qui assemble ; l'architecte est
  celui qui commande aux charpentiers. Le mot dit un métier de chantier, avant
  l'art du dessin.
famille: [ technique, tectonique ]
themes: [ travail, maison ]
sources:
  - ouvrage: littre
    entree: architecte
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
