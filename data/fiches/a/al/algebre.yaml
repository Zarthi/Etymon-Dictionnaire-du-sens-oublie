mot: algèbre
nature: [ nom féminin ]
etymologie:
  - forme: algebra
    langue: latin médiéval
    forge:
      par: [ gerard-de-cremone ]
      date: XIIe siècle
  - forme: الجبر
    translitteration: al-ǧabr
    langue: arabe
    sens: la réduction, la restauration
    ouvrage: al-jabr
explication: >-
  Al-ǧabr désigne la remise en place de ce qui est rompu ; en espagnol, algebra a aussi
  nommé l'art de remettre les os déboîtés. Dans le traité, c'est l'opération qui supprime
  un terme soustrait en l'ajoutant aux deux membres de l'équation.
