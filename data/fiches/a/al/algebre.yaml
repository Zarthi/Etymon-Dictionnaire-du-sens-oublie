mot: algèbre
nature: [ nom féminin ]
etymologie:
  - forme: algebra
    langue: latin médiéval
    forge:
      par: [ gerard-de-cremone ]
      date: XIIe siècle
  - forme: الجبر
    translitteration: al-ǧabr
    langue: arabe
    sens: réduction, réunion des parties séparées
    ouvrage: al-jabr
explication: >-
  Dans le titre du traité, al-ǧabr se rapporte à une opération sur les
  équations ; en espagnol, algebra a aussi nommé l'art de remettre les membres
  disloqués. Le mot désigne aujourd'hui une branche entière des mathématiques,
  et, par extension, une chose difficile à comprendre.
famille: [ algébrique ]
themes: [ savoir ]
