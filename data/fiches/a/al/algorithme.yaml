mot: algorithme
nature: [ nom masculin ]
etymologie:
  - forme: alguarismo
    langue: ancien espagnol
    sens: art de compter
  - forme: الخوارزمي
    translitteration: al-Ḫuwārizmī
    langue: arabe
    sens: celui du Khwarezm
    personne: al-khwarizmi
explication: >-
  Le mot vient du nom d'al-Khwârizmî, dont les traités firent connaître en Europe le
  calcul avec les chiffres dits arabes. Son nom latinisé a désigné ce calcul, puis toute
  méthode de calcul réglée.
ecartees:
  - forme: ἀριθμός
    langue: grec ancien
    sens: nombre
    raison: "Littré la rapporte et l'écarte : seul le nom du mathématicien rend
      compte du g."
famille: [ algorithmique ]
themes: [ savoir ]
sources:
