mot: algorithme
nature: [ nom masculin ]
etymologie:
  - forme: algorisme
    langue: ancien français
  - forme: alguarismo
    langue: ancien espagnol
    sens: art de compter
  - forme: الخوارزمي
    translitteration: al-Ḫuwārizmī
    langue: arabe
    sens: celui du Khwarezm
    personne: al-khwarizmi
explication: >-
  Algorisme a d'abord nommé le calcul avec les chiffres arabes, que les
  traductions des œuvres d'al-Khwârizmî avaient introduit dans l'Europe
  médiévale ; croisé avec ἀριθμός, il est devenu algorithme. Le mot désigne
  aujourd'hui l'ensemble des procédés propres à un calcul.
ecartees:
  - forme: ἀριθμός
    langue: grec ancien
    sens: nombre
    raison: Littré l'écarte comme étymon, précédé de l'article arabe, car seul le
      nom d'al-Khwârizmî rend compte du g ; le TLFi n'y voit qu'un croisement,
      qui a donné la forme algorithme.
famille: [ algorithmique ]
renvois: [ algebre ]
themes: [ savoir ]
sources:
  - ouvrage: tlfi
    entree: algorithme
  - ouvrage: littre
    entree: algorithme
redaction:
  - par: IA
    detail: Claude Opus 5.5
    reflexion: élevée
statut: brouillon
