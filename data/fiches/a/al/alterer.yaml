mot: altérer
nature: [ verbe ]
etymologie:
  - forme: alterare
    langue: latin médiéval
    sens: rendre autre
explication: >
  Altérer, c'est rendre autre : alter. Le vin altéré a changé, pour le pire ;
  l'homme altéré a soif, son corps a changé d'état. Dans tous les sens, quelque
  chose n'est plus ce qu'il était.
famille: [ autre, alternative, altérité ]
themes: [ corps, nature ]
sources:
  - ouvrage: littre
    entree: altérer
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
