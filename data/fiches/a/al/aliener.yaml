mot: aliéner
nature: [ verbe ]
etymon: alienare
langue: latin
sens: rendre autre, céder à un autre
explication: >
  Alienus, c'est ce qui appartient à un autre. Aliéner un bien, c'est le faire
  passer à autrui ; être aliéné, c'est devenir autre à soi-même, étranger à sa
  propre raison.
famille: [ autre, autrui, alias ]
themes: [ droit, esprit, société ]
sources:
  - ouvrage: Littré
    entree: aliéner
redaction:
  - par: IA
    detail: Claude Fable 5.1
statut: brouillon
