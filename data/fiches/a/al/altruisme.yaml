mot: altruisme
nature: [ nom masculin ]
etymologie:
  - forme: altruisme
    langue: français
    forge:
      par: [ auguste-comte, francois-andrieux ]
      date: vers 1830
    modele:
      forme: égoïsme
      langue: français
      relation: analogie
  - forme: alter
    langue: latin
    sens: l'autre de deux
explication: >-
  Comte nommait ainsi l'ensemble des penchants bienveillants innés de
  l'individu, une disposition organique opposée à l'égoïsme. Le mot a perdu ce
  caractère organique : il désigne aujourd'hui une disposition bienveillante
  envers les autres, ou une conduite morale tournée vers leur intérêt.
famille: [ altruiste, autrui ]
themes: [ morale ]
sources:
  - ouvrage: littre
    entree: altruisme
  - ouvrage: tlfi
    entree: altruisme
  - ouvrage: littre
    entree: autrui
  - ouvrage: littre
    entree: égoïsme
  - ouvrage: lewis-short
    entree: alter
redaction:
  - par: IA
    detail: Claude Opus 5.5
    reflexion: élevée
statut: brouillon
