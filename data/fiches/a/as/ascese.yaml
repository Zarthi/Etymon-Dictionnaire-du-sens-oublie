mot: ascèse
nature: [ nom féminin ]
etymon: áskēsis
graphie: ἄσκησις
reconstruit: false
langue: grec ancien
sens: exercice, entraînement
explication: >
  Askēsis est l'entraînement de l'athlète, l'exercice répété qui forme le corps.
  Les philosophes puis les moines ont repris le mot pour l'exercice de l'âme.
  L'ascète est un athlète, non un affamé.
