mot: assister
etymon: assistere
reconstruit: false
langue: latin
sens: se tenir auprès de
explication: >
  Assister, c'est se tenir debout à côté : assistere. Celui qui assiste à une
  cérémonie s'y tient présent ; celui qui assiste un malade se tient près de
  lui. Les deux sens sont un seul, celui de la présence.
