mot: assurance
nature: [nom féminin]
etymon: "*assecurare"
reconstruit: true
langue: latin populaire
sens: rendre sûr, mettre hors de souci
explication: >
  Securus est celui qui est sans souci : sine cura. Assurer, c'est rendre sûr,
  délivrer de l'inquiétude. L'assurance de la personne et celle du contrat
  promettent la même chose : ne plus avoir à se soucier.
incertain: false
