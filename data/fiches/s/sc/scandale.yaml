mot: scandale
nature: [ nom masculin ]
etymologie:
  - forme: scandalum
    langue: latin ecclésiastique
    sens: ce sur quoi on trébuche
  - forme: σκάνδαλον
    langue: grec ancien
    sens: piège placé sur le chemin pour faire trébucher
explication: >-
  Le grec nommait le piège qui fait tomber ; la Bible grecque en a fait ce qui
  fait tomber dans le péché. Le français a gardé cette idée de chute, puis l'a
  étendue à l'indignation publique qu'un acte soulève.
themes: [ religion, société ]
