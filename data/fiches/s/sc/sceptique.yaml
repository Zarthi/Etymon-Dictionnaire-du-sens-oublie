mot: sceptique
nature: [ adjectif ]
etymologie:
  - forme: σκεπτικός
    langue: grec ancien
    sens: qui observe, qui réfléchit
  - forme: σκέπτεσθαι
    langue: grec ancien
    sens: observer
explication: >-
  Le sceptique grec était celui qui observe et examine. Le mot a fini par
  désigner celui qui doute, alors qu'il disait d'abord une attention à voir.
