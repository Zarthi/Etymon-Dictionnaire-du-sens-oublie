mot: schizophrénie
nature: [ nom féminin ]
etymologie:
  - forme: Schizophrenie
    langue: allemand
    forge:
      par: [ eugen-bleuler ]
      date: "1911"
      ouvrage: dementia-praecox
  - langue: grec ancien
    sens: esprit fendu
    elements:
      - forme: σχίζω
        sens: fendre
      - forme: φρήν
        sens: diaphragme
explication: >-
  Bleuler renommait la démence précoce : non un dédoublement de la personnalité,
  contresens devenu courant, mais une discordance entre pensée, affects et volonté. Les
  Grecs situaient la pensée dans la poitrine, non dans la tête.
famille: [ schizophrène, frénésie, frénétique ]
renvois: [ delire, folie ]
themes: [ esprit, santé ]
tradition:
  renvois: [ obsession ]
sources:
  - ouvrage: tlfi
    entree: schizophrénie
  - ouvrage: bailly
    entree: σχίζω
  - ouvrage: bailly
    entree: φρήν
redaction:
  - par: IA
    detail: Claude Opus 5.5
statut: brouillon
