mot: schizophrénie
nature: [ nom féminin ]
etymologie:
  - forme: Schizophrenie
    langue: allemand
    forge:
      par: [ eugen-bleuler ]
      date: "1911"
  - langue: grec ancien
    elements:
      - forme: σχίζω
        sens: fendre
      - forme: φρήν
        sens: diaphragme, puis siège des passions et de la pensée
explication: >-
  Bleuler désignait la discordance entre pensée, affects et volonté, non un
  dédoublement de la personnalité, contresens devenu courant. Le phrēn grec est
  d'abord le diaphragme : on logeait la pensée dans la poitrine.
famille: [ schizophrène, frénésie, frénétique ]
renvois: [ obsession ]
themes: [ esprit, santé ]
sources:
  - ouvrage: tlfi
    entree: schizophrénie
  - ouvrage: bailly
    entree: σχίζω
  - ouvrage: bailly
    entree: φρήν
redaction:
  - par: IA
    detail: Claude Opus 5.5
statut: brouillon
