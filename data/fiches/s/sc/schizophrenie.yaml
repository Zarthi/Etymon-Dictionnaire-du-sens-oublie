mot: schizophrénie
nature: [ nom féminin ]
etymologie:
  - forme: Schizophrenie
    langue: allemand
    forge:
      par: [ eugen-bleuler ]
      date: "1911"
      ouvrage: dementia-praecox
  - langue: grec ancien
    sens: esprit fendu
    elements:
      - forme: σχίζω
        sens: fendre
      - forme: φρήν
        sens: diaphragme
explication: >-
  Bleuler renommait la démence précoce : non un dédoublement de la
  personnalité, contresens devenu courant, mais une discordance entre pensée,
  affects et volonté. Ce que le mot fend, les Grecs le logeaient dans la
  poitrine, non dans la tête.
famille: [ schizophrène, frénésie, frénétique ]
renvois: [ delire, folie ]
renvoisTradition: [ obsession ]
themes: [ esprit, santé ]
sources:
  - ouvrage: tlfi
    entree: schizophrénie
  - ouvrage: bailly
    entree: σχίζω
  - ouvrage: bailly
    entree: φρήν
redaction:
  - par: IA
    detail: Claude Opus 5.5
statut: brouillon
