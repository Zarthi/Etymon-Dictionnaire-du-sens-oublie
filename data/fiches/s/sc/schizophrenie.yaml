mot: schizophrénie
nature: [ nom féminin ]
etymologie:
  - forme: Schizophrenie
    langue: allemand
    forge:
      par: [ eugen-bleuler ]
      date: "1908"
  - langue: grec ancien
    sens: esprit fendu
    elements:
      - forme: σχίζω
        sens: fendre
      - forme: φρήν
        sens: esprit
explication: >-
  Bleuler renommait la démence précoce, parce que la scission des fonctions
  psychiques en était à ses yeux l'un des caractères les plus importants. En
  grec, φρήν désignait d'abord le diaphragme, puis le cœur ou l'âme, siège des
  sentiments et de la pensée.
