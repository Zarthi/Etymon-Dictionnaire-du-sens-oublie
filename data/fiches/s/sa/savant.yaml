mot: savant
nature: [ adjectif ]
etymologie:
  - forme: savoir
    langue: français
  - forme: "*sapēre"
    langue: latin populaire
  - forme: sapere
    langue: latin
    sens: avoir de la saveur
explication: >-
  Le latin sapere n'a signifié savoir qu'ensuite, employé avec un complément.
  Savant, ancien participe présent de savoir, se disait vers 1120 de la personne
  qui sait ; il qualifie aujourd'hui qui a un grand savoir, et le nom (1588) la
  personne de grande érudition.
themes: [ savoir ]
