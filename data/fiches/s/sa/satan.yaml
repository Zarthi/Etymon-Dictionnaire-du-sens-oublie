mot: Satan
nature: [ nom masculin ]
etymologie:
  - forme: Satanas
    langue: latin ecclésiastique
  - forme: Σατανᾶς
    langue: grec ancien
  - forme: שָׂטָן
    translitteration: śāṭān
    langue: hébreu
    sens: adversaire, accusateur
explication: >-
  Dans la Bible hébraïque, śāṭān est un nom commun : un homme peut l'être pour
  un autre, et l'ange de YHWH se poste en śāṭān sur la route de Balaam ; dans
  Job, c'est l'office d'accusateur tenu par l'un des anges. Le français a reçu
  le mot comme nom de l'esprit du mal, à la fin du Xe siècle.
famille: [ satanique, satanisme ]
renvois: [ diable, demon ]
themes: [ religion ]
tradition:
  lectures:
    - texte: "En latin, le nom veut dire adversaire ou transgresseur : adversaire, parce qu'il est l'ennemi de la vérité et s'efforce toujours de contrarier les vertus des saints ; transgresseur, parce qu'il est devenu prévaricateur et n'est pas demeuré dans la vérité où il fut créé."
      citation: "Satanas in Latino sonat adversarius, sive transgressor. Ipse est enim adversarius, qui est veritatis inimicus, et semper sanctorum virtutibus contraire nititur. Ipse et transgressor, quia praevaricator effectus in veritate, qua conditus est, non stetit."
      sources:
        - ouvrage: etymologies
          entree: "VIII, 11, 19"
          url: https://la.wikisource.org/wiki/Etymologiarum_libri_XX/Liber_VIII
