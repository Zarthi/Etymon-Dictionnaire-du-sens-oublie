mot: saveur
nature: [ nom féminin ]
etymologie:
  - forme: sapor
    langue: latin
  - forme: sapere
    langue: latin
    sens: avoir du goût
explication: >-
  De sapere vient aussi savoir. Vers 1160, saveur nommait l'assaisonnement et la
  qualité perçue par le goût ; le mot s'est dit par figure d'une personne au
  XIIIe siècle, puis d'une œuvre de l'esprit en 1718.
famille: [ savourer, savoureux ]
themes: [ nourriture ]
