mot: sapience
nature: [ nom féminin ]
etymologie:
  - forme: sapientia
    langue: latin
    sens: sagesse, goût
  - forme: sapere
    langue: latin
    sens: avoir du goût, juger
explication: >-
  Sapientia venait de sapere, qui disait avoir du goût, puis juger. Le mot dit
  aujourd'hui une sagesse, alors qu'il désignait d'abord un discernement du
  goût.
renvois: [ critique ]
themes: [ savoir, morale ]
tradition:
