explication: >-
  Le mot est attesté en 1734 ; il nommait le fait de se donner la mort, sur le
  modèle d'homicide. Il a désigné en 1752 la personne qui se suicide, et s'étend
  aujourd'hui aux actes qui ruinent la carrière ou l'image de leur auteur.
