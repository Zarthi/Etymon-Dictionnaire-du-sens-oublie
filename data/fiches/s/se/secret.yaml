mot: secret
nature: [ adjectif ]
etymologie:
  - forme: secretus
    langue: latin
    sens: mis à part, caché
    elements:
      - forme: se-
        sens: à part
      - forme: cernere
        sens: distinguer, séparer
explication: >-
  Secretus, c'est ce qui est mis à part, séparé des autres ; le mot a gardé
  l'idée de ce qui est tenu à l'écart, puis il a désigné ce qui n'est connu que
  d'un petit nombre, et le fait de le taire.
