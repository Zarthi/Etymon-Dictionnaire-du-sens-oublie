mot: sensible
nature: [ adjectif ]
etymologie:
  - forme: sensibilis
    langue: latin
    sens: qui peut être ressenti
explication: >-
  Le latin sensibilis a pris ensuite le sens actif de doué de sensibilité. Le
  français a reçu les deux : qui reçoit les impressions physiques (vers 1265),
  qui fait impression sur les sens (vers 1320) ; le sens d'aisément ému date de
  1643.
