    langue: latin
    sens: association, réunion, compagnie
  - forme: socius
    langue: latin
    sens: compagnon, associé
explication: >-
  Le mot vient de societas, « association, compagnie », dérivé de socius,
  « compagnon ». Il a d'abord nommé la compagnie et l'union des hommes, puis la
  communauté organisée et le milieu de la vie collective.
