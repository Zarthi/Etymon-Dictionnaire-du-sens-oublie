mot: soupçon
nature: [ nom masculin ]
etymologie:
  - forme: suspicio
    langue: latin
    sens: soupçon
  - forme: suspicere
    langue: latin
    sens: regarder de bas en haut ; soupçonner
    elements:
      - forme: susum
        sens: en haut
      - forme: spicere
