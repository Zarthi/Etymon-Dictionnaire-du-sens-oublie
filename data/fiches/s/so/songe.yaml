  - forme: somnium
    langue: latin
    sens: songe, rêve ; vision
explication: >-
  Le latin somnium disait le rêve et la vision de la nuit. Songe a été peu à peu
  supplanté par rêve, mais il garde le sens du rêve porteur d'un avertissement
  et de la rêverie.
