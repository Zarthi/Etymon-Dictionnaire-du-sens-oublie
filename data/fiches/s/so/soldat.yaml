mot: soldat
etymon: soldato
reconstruit: false
langue: italien
sens: payé d'une solde
explication: >
  Le soldat est d'abord celui qu'on paie : le mot italien est le participe de
  soldare, payer une solde. L'homme d'armes est nommé par son salaire.
