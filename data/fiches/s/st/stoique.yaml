mot: stoïque
nature: [ adjectif ]
etymologie:
  - forme: stoicus
    langue: latin
    sens: stoïcien
  - forme: Στωικός
    langue: grec ancien
  - forme: στοά
    langue: grec ancien
    sens: portique
explication: >-
  Stoïque désignait l'adepte de la doctrine de Zénon, qui enseignait sous le
  portique d'Athènes ; le mot a pris le sens de fermeté devant la douleur et
  l'adversité, sans que la doctrine soit toujours en vue.
famille: [ stoïcisme, stoïcien, stoïquement ]
renvois: [ brave ]
themes: [ morale, esprit ]
tradition:
