mot: exister
nature: [ verbe ]
etymologie:
  - forme: existere
    langue: latin
    sens: sortir de, se manifester, se montrer
    elements:
      - forme: ex-
        sens: hors de
      - forme: sistere
        sens: être debout, stable (dérivé de stare)
explication: >-
  existere disait sortir de, se manifester, se montrer : ex- et sistere, se
  tenir debout. Le mot a dit en français être actuellement (XVe siècle), puis
  vivre (1760), et aujourd'hui posséder une réalité, durer ; le fait de se tenir
  debout ne se lit plus dans le mot.
famille: [ existence, coexister ]
themes: [ esprit ]
