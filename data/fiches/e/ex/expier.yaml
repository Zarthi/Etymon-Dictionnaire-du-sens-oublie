mot: expier
nature: [ verbe ]
etymologie:
  - forme: expiare
    langue: latin
    sens: purifier, réparer une faute
    elements:
      - forme: ex-
        sens: exprimant l'achèvement
      - forme: pius
        sens: pieux
explication: >-
  expiare disait purifier, réparer une faute : ex- et pius, le pieux. En
  français, d'abord réparer une faute en subissant la peine (ca 1272), puis
  purifier (ca 1355). Le pieux qui purifie ne se lit plus, reste la peine qui
  répare.
famille: [ expiation, inexpiable ]
themes: [ religion, morale ]
