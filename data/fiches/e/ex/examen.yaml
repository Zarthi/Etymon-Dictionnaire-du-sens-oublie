etymologie:
  - forme: examen
    langue: latin
    sens: aiguille de balance
explication: >-
  examen disait l'aiguille de la balance. De la pesée exacte, le mot a passé au
  contrôle, puis, en français, à l'étude minutieuse (1372) et à l'épreuve du
  candidat (1485).
