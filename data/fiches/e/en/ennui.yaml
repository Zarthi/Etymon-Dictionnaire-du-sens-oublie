etymon: in odio
reconstruit: false
langue: latin
sens: en haine
explication: >
  Être « en haine » à quelqu'un, c'était lui être odieux. L'ennui fut d'abord un
  tourment, un chagrin profond, avant de s'affaiblir en simple lassitude.
