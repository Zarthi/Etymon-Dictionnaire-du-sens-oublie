mot: ennemi
nature: [ nom ]
etymologie:
  - forme: inimicus
    langue: latin
    sens: ennemi particulier
    elements:
      - forme: in-
        sens: non
      - forme: amicus
        sens: ami
explication: >-
  Inimicus a désigné l'ennemi particulier, puis aussi l'ennemi public. Le mot
  français porte les deux sens : celui qui déteste quelqu'un et cherche à lui
  nuire (vers 880), celui qui fait la guerre (vers 1100).
famille: [ inimitié, ami ]
themes: [ société, guerre ]
sources:
