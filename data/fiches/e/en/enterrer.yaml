mot: enterrer
nature: [ verbe ]
etymologie:
  - forme: enterrer
    langue: français
  - forme: terre
    langue: ancien français
    sens: terre
explication: >-
  Enterrer, c'est mettre en terre : dès 1100 le corps d'un mort, honoré (« A
  grant honor pois les unt enterrez »), dès 1140 ce que la terre recouvre, dès
  1690 ce qu'un amoncellement ensevelit ; le figuré a suivi, jusqu'à faire
  disparaître complètement, faire oublier.
