mot: écrire
nature: [ verbe ]
etymologie:
  - forme: scribere
    langue: latin
    sens: graver avec une pointe ; tracer des lettres
explication: >-
  Le trait gratté ou gravé à la pointe ne s'entend plus dans écrire : le latin
  scribere disait déjà toute écriture et la composition d'un ouvrage, et écrire
  signifie dès 1050 mettre par écrit, rédiger.
