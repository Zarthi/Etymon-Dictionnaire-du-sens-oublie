mot: essence
nature: [ nom féminin ]
etymologie:
  - forme: essentia
    langue: latin
    sens: nature d'une chose
explication: >-
  essentia disait la nature d'une chose, ce qu'elle est ; le français l'a
  d'abord prise en ce sens (ca 1200, essence de la divinité), puis pour
  l'extrait qui tient ce qu'il y a de plus pur dans une substance (1563), enfin
  pour l'essence de pétrole. Ce qu'une chose est s'est doublé de ce qu'on en
  tire.
famille: [ essentiel ]
