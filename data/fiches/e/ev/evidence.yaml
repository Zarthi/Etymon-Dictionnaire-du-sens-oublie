redaction:
  - par: IA
    detail: Claude Opus 5.5
    reflexion: élevée
tradition:
  lectures:
    - texte: "Le mot des Grecs, on le rendra par evidentia, quitte à forger des mots ; et l'on jugeait qu'aucun discours ne peut être plus clair que l'évidence même, ni qu'il faille définir ce qui est si clair."
      citation: "ut Graeci: perspicuitatem aut euidentiam nos, si placet, nominemus fabricemurque, si opus erit, uerba […] sed tamen orationem nullam putabant illustriorem ipsa euidentia reperiri posse nec ea, quae tam clara essent, definienda censebant."
      sources:
        - ouvrage: academiques
          entree: "II, 6, 17"
          url: https://la.wikisource.org/wiki/Academica_priora
statut: brouillon
