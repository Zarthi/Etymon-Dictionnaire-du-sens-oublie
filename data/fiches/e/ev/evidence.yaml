mot: évidence
nature: [ nom féminin ]
etymologie:
  - forme: evidentia
    langue: latin
  - forme: evidens
    langue: latin
    sens: visible, manifeste
    elements:
      - forme: ex
        sens: hors de
      - forme: videre
        sens: voir
explication: >-
  En latin, evidentia se disait de la clarté, notamment de celle du discours. Le
  mot français nomme ce qui entraîne aussitôt l'assentiment de l'esprit ; le
  sens de ce qui se voit lui reste, comme dans « mettre en évidence », rendre
  visible.
famille: [ évident, évidemment ]
themes: [ savoir, esprit ]
