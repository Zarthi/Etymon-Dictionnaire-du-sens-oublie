mot: erreur
nature: [ nom féminin ]
etymologie:
  - forme: error
    langue: latin
    sens: action d'errer çà et là
explication: >-
  En latin, error disait aussi l'incertitude et la méprise, et en latin chrétien
  la doctrine fausse. Le français l'a d'abord dit de la tromperie (fin du Xe
  siècle), puis du fait de se tromper (vers 1125) ; le sens d'errance y est
  vieilli ou littéraire.
