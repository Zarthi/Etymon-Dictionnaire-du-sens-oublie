mot: étonner
nature: [ verbe ]
etymologie:
  - forme: "*extonare"
    langue: latin populaire
    sens: ébranler comme d'un coup de tonnerre
explication: >-
  Le sens propre a longtemps survécu : on étonnait la roche ou un diamant
  en les fêlant, et pour les classiques, être étonné, c'était rester frappé de
  stupeur. Le mot ne dit plus qu'une surprise.
themes: [ émotions ]
sources:
