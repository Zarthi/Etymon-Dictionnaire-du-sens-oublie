mot: étonner
nature: [ verbe ]
etymologie:
  - forme: "*extonare"
    langue: latin populaire
    sens: ébranler comme par un coup de tonnerre
explication: >-
  Vers 1100, étonner, c'était être étourdi par un coup violent ; la langue
  classique y entendait encore épouvanter comme la foudre. Le mot dit
  aujourd'hui la surprise devant l'extraordinaire ou l'inattendu ; le sens
  concret reste dans des emplois techniques : étonner une roche, une voûte.
themes: [ émotions ]
