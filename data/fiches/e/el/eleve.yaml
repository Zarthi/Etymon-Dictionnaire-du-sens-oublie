explication: >-
  Levare soulevait : élever a d'abord porté une chose plus haut, puis, dès la
  fin du XIIIe siècle, a mené un enfant à son plein développement. Élevé dit
  aujourd'hui la hauteur des lieux, des prix et des rangs, et celle de l'esprit.
