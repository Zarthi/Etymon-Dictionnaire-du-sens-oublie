mot: élégant
nature: [ adjectif ]
etymologie:
  - forme: elegans
    langue: latin
    sens: distingué, de bon goût
  - forme: eligere
    langue: latin
    sens: choisir
explication: >-
  Jusqu'au temps de Caton, selon Aulu-Gelle, elegans était un reproche : il se
  disait de qui vivait de manière trop recherchée ; le latin classique en fit un
  éloge. Élégant qualifie aujourd'hui une grâce aisée, un goût sûr dans le choix
  des vêtements ou des mots, une solution simple et claire.
incertain: true
famille: [ élégance, élégamment, inélégant ]
renvois: [ grace ]
themes: [ société ]
sources:
