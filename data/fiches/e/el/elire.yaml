mot: élire
nature: [ verbe ]
etymologie:
  - forme: exlegere
    langue: latin populaire
  - forme: eligere
    langue: latin
    sens: choisir
    elements:
      - forme: e-
        sens: hors de
      - forme: legere
        sens: cueillir
explication: >-
  Vers 1100, eslire signifiait choisir entre plusieurs personnes ou choses ; le
  sens de nommer par suffrages, attesté vers 1207, reste rare avant le XVIe
  siècle. Le mot dit aujourd'hui ce choix par suffrages ; du choix en général,
  il garde la préférence pour une personne ou une chose parmi d'autres.
