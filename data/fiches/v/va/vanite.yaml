    sens: vide, vain
explication: >-
  Vanitas venait de vanus, « vide » : la vanité est d'abord un néant, une
  apparence sans réalité. L'orgueil ne s'y est joint qu'en 1580, quand le mot
  s'est dit d'une personne contente d'elle-même.
