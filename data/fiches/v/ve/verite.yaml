mot: vérité
nature: [ nom féminin ]
etymologie:
  - forme: veritas
    langue: latin
    sens: le vrai, la réalité
explication: >-
  Le mot paraît dans la seconde moitié du Xe siècle pour l'opinion conforme à ce
  qui est, en matière de religion, opposée à l'erreur ; aux XIIIe et XIVe
  siècles, il nomme le caractère de toute connaissance jugée vraie. Il garde le
  sens latin de réalité : ce qui existe indépendamment de l'esprit.
famille: [ vrai, véritable, véridique, vérifier ]
renvois: [ mensonge ]
themes: [ savoir, morale ]
sources:
