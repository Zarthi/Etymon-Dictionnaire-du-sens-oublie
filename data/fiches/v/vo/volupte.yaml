mot: volupté
nature: [ nom féminin ]
etymologie:
  - forme: voluptas
    langue: latin
    sens: plaisir, de l'âme comme du corps
explication: >-
  Volupté est entré en français pour les plaisirs des sens (1404), puis le
  plaisir sexuel (1554) ; la délectation de l'esprit, que voluptas disait aussi,
  n'y est attestée qu'en 1588. Le mot dit aujourd'hui l'impression agréable des
  sens et de l'amour, et la vive satisfaction de l'esprit.
