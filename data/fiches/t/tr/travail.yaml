mot: travail
nature: [ nom masculin ]
etymologie:
  - forme: travailler
    langue: français
  - forme: "*tripaliare"
    langue: latin populaire
    sens: torturer
  - forme: trepalium
    langue: latin médiéval
    sens: instrument de torture
explication: >-
  Travailler a d'abord signifié tourmenter, faire souffrir ; le travail a
  désigné la peine endurée, et les douleurs de l'accouchement, sens qui demeure.
  Celui d'activité qui fait vivre, devenu très rare au XVIe siècle, est revenu
  en force au XVIIe.
