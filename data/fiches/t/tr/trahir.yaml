mot: trahir
nature: [ verbe ]
etymologie:
  - forme: tradere
    langue: latin
    sens: transmettre, confier, livrer
explication: >-
  Tradere disait transmettre, confier, livrer. Livrer quelqu'un à ses ennemis,
  c'est le trahir : le mot dit le manquement à la foi et s'est étendu à la
  révélation d'un secret.
