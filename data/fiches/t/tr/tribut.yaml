mot: tribut
nature: [ nom masculin ]
etymologie:
  - forme: tributum
    langue: latin
    sens: impôt, taxe
  - forme: tribuere
    langue: latin
    sens: répartir, attribuer
explication: >-
  Tribut nommait l'impôt payé au vainqueur. Le mot désigne aujourd'hui ce que
  l'on doit par obligation ou par hommage.
