mot: texte
nature: [ nom masculin ]
etymologie:
  - forme: textus
    langue: latin
    sens: tissu, trame
explication: >-
  Le latin textus est passé du tissu à l'enchaînement d'un récit, puis au récit
  et, dans la liturgie, à l'évangile. En français, texte nomme d'abord le volume
  des évangiles, puis le passage authentique d'un livre saint, opposé à la glose
  (vers 1220) ; aujourd'hui, tout écrit.
