explication: >-
  Bourgeois a d'abord désigné l'habitant d'un bourg, d'une ville affranchie. Dès
  1635, le mot prend un sens péjoratif ; il a ensuite désigné la classe
  intermédiaire entre nobles et paysans, puis l'homme attaché à son confort.
