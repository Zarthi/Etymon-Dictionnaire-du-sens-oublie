    modele:
      forme: benevolentia
      langue: latin
      sens: bienveillance
      relation: calque
explication: >-
  Bienveillance a été fait en français sur le modèle du latin benevolentia,
  composé de bene, « bien », et de velle, « vouloir » : la volonté du bien.
  L'usage courant y voit surtout une disposition favorable envers quelqu'un ; le
  mot dit aussi la volonté qui vise le bien et le bonheur d'autrui.
