mot: zéro
nature: [ nom masculin ]
etymon: zero
reconstruit: false
langue: italien
sens: zéro, rien
explication: >
  Zéro et chiffre sont un même mot arabe venu par deux chemins : l'italien pour
  l'un, le latin médiéval pour l'autre. Chiffre désignait d'abord le zéro, avant
  que zéro ne le supplante dans ce sens.
