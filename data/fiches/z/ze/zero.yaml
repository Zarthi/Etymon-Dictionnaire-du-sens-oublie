mot: zéro
nature: [ nom masculin ]
etymologie:
  - forme: zero
    langue: italien
    sens: zéro, rien
  - forme: صفر
    translitteration: ṣifr
    langue: arabe
    sens: vide
explication: >-
  Zéro et chiffre sont un même mot arabe, venu en français par deux voies : l'italien pour
  l'un, le latin médiéval pour l'autre. Chiffre a d'abord désigné le zéro, avant que zéro
  ne le remplace dans ce sens.
