mot: zéro
nature: [ nom masculin ]
etymologie:
  - forme: zero
    langue: italien
  - forme: zefiro
    langue: italien
  - forme: zephirum
    langue: latin médiéval
  - forme: صفر
    translitteration: ṣifr
    langue: arabe
    sens: vide
explication: >-
  Le mot a gardé l'idée de vide : il nomme une valeur nulle, rien, et, dès 1512,
  une personne sans valeur. Il désigne aussi, depuis 1757, le point d'où part
  une échelle, comme celle du thermomètre.
