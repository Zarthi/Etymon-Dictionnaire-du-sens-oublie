  - forme: habitudo
    langue: bas latin
    sens: manière d'être, disposition ; relation
explication: >-
  Habitudo disait la manière d'être, l'état, et aussi la relation. Le mot
  français a d'abord nommé un rapport, puis la disposition du corps, avant de se
  fixer sur la disposition acquise par répétition.
