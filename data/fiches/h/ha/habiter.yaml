mot: habiter
nature: [ verbe ]
etymologie:
  - forme: habitare
    langue: latin
    sens: avoir souvent, séjourner habituellement
explication: >-
  Habiter, fréquentatif de habere, disait avoir souvent, être souvent en un
  lieu. Le mot ne dit plus l'avoir : il dit le fait de résider, d'occuper une
  demeure.
