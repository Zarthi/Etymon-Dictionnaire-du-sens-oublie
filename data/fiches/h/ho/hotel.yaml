mot: hôtel
etymon: hospitale
reconstruit: false
langue: latin
sens: chambre des hôtes
explication: >
  Le mot latin désignait la chambre où l'on recevait les hôtes. Hôtel en est la
  forme populaire ; hôpital, refait sur le latin, en est l'autre héritier.
