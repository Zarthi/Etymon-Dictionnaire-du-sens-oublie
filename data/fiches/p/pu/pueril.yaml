mot: puéril
nature: [ adjectif ]
etymologie:
  - forme: puerilis
    langue: latin
    sens: de l'enfance, irréfléchi
explication: >-
  Puéril a d'abord qualifié, avec blâme, ce qui ne convient qu'à un enfant ; le
  sens neutre de « relatif à l'enfance » est venu au XVIe siècle, mais le mot
  dit le plus souvent le manque de maturité et de sérieux.
