mot: parole
nature: [ nom féminin ]
etymologie:
  - forme: parabola
    langue: latin ecclésiastique
    sens: parabole, discours
  - forme: παραβολή
    langue: grec ancien
    sens: comparaison, rapprochement
explication: >-
  Le latin chrétien a fait de parabola le nom des paraboles et d'un discours
  grave, inspiré ; fréquent dans les sermons, il a supplanté dans les langues
  romanes le mot latin d'où vient verbe, réservé au Verbe divin. Parole n'a rien
  gardé de la comparaison.
