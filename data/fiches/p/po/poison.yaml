mot: poison
nature: [ nom masculin ]
etymologie:
  - forme: potio
    langue: latin
    sens: boisson, breuvage
explication: >
  Le poison n'était d'abord qu'une boisson. Le mot s'est restreint au breuvage
  malfaisant, et de féminin il est devenu masculin au XVIe siècle.
doublets: [ potion ]
themes: [ santé ]
sources:
