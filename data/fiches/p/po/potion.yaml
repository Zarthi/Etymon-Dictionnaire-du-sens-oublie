mot: potion
nature: [ nom féminin ]
etymologie:
  - forme: potio
    langue: latin
    sens: boisson, breuvage
explication: >
  Potion est l'emprunt savant du mot latin qui, par la voie populaire, a donné
  poison. Il a gardé le sens de breuvage, spécialisé en remède.
themes: [ santé ]
sources:
