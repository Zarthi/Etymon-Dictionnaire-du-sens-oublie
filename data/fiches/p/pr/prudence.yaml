mot: prudence
nature: [ nom féminin ]
etymologie:
  - forme: prudentia
    langue: latin
    sens: prévoyance, sagesse
  - forme: prudens
    langue: latin
    sens: qui prévoit
  - forme: providens
    langue: latin
    sens: qui prévoit
    elements:
      - forme: pro-
        sens: en avant
      - forme: videre
        sens: voir
explication: >-
  Prudentia nommait la prévoyance, la capacité de voir d'avance ; le mot dit
  aujourd'hui la circonspection dans l'action, et la prudence comme vertu
  cardinale.
