mot: profession
nature: [ nom féminin ]
etymologie:
  - forme: professio
    langue: latin
    sens: déclaration publique ; état, métier
  - forme: profiteri
    langue: latin
    sens: déclarer ouvertement, se donner comme
explication: >-
  Profession a d'abord nommé la déclaration publique de sa foi ou de ses
  opinions, puis l'état qu'on déclare exercer. Le mot désigne aujourd'hui
  l'activité par laquelle on gagne sa vie ; la déclaration de foi survit dans
  « profession de foi ».
famille: [ professionnel, professionnalisme, profès ]
themes: [ travail, société ]
sources:
