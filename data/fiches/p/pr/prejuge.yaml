    langue: français
  - forme: praejudicare
    langue: latin
    sens: juger d'avance
explication: >-
  Praejudicare se disait d'abord en justice. Préjugé a nommé en 1579 ce qui
  détermine une opinion, puis, chez Montaigne, l'opinion reçue sans examen de
  son milieu ou de son éducation ; le sens de précédent judiciaire est vieilli.
