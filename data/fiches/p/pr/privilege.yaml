mot: privilège
nature: [ nom masculin ]
etymologie:
  - forme: privilegium
    langue: latin
    sens: loi concernant un particulier
    elements:
      - forme: privus
        sens: propre, particulier
      - forme: lex
        sens: loi
explication: >-
  Privilegium nommait une loi faite pour un particulier. Le mot désigne
  aujourd'hui un avantage réservé à une personne ou à un groupe.
renvois: [ propriete ]
themes: [ droit, politique ]
tradition:
  lectures:
    - texte: Les privilèges sont les lois des particuliers, comme des lois privées.
      citation: Privilegia autem sunt leges privatorum, quasi privatae leges.
      sources:
