mot: preuve
nature: [ nom féminin ]
etymologie:
  - forme: prouver
    langue: français
  - forme: probare
    langue: latin
    sens: éprouver, vérifier ; trouver bon
explication: >-
  Preuve a nommé aussi l'épreuve et l'expérience (1253) ; ce sens reste dans la
  langue du sucrier (1765) et dans celle du distillateur, pour l'essai du sirop
  ou de l'eau-de-vie. Le mot désigne aujourd'hui ce qui établit la vérité ou la
  réalité d'un fait.
