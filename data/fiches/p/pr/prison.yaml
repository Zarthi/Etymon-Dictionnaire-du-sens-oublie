mot: prison
nature: [ nom féminin ]
etymologie:
  - forme: prehensio
    langue: latin
    sens: action de saisir, prise
explication: >-
  Prison a d'abord nommé la prise, l'action de saisir un corps, avant de nommer
  le lieu où l'on garde les captifs. Le français a gardé les deux idées : la
  prison retient, et l'on est prisonnier comme on est pris.
