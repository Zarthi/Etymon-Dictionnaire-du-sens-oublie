mot: père
nature: [ nom masculin ]
etymologie:
  - forme: pater
    langue: latin
    sens: celui qui engendre ; fondateur
explication: >-
  Pater désignait aussi le père comme chef de la maison, et servait d'épithète
  de vénération ; en latin chrétien, il a nommé Dieu créateur, premier sens
  attesté en français (fin du Xe siècle). Le mot désigne aujourd'hui l'homme qui
  a engendré ou en tient le rôle, Dieu le Père, et le fondateur.
famille: [ paternel, paternité, patrie ]
themes: [ famille ]
tradition:
  lectures:
    - texte: "Le père est celui de qui la lignée prend son commencement, et c'est pourquoi on le nomme paterfamilias ; il est dit pater parce qu'il engendre le fils, la patratione accomplie."
      citation: "Pater est, a quo initium nascitur generis. Itaque is paterfamilias vocitatur. Pater autem dictus eo quod patratione peracta filium procreet. Patratio enim est rei veneriae consummatio."
      sources:
        - ouvrage: etymologies
          entree: "IX, 5, 3"
          url: https://la.wikisource.org/wiki/Etymologiarum_libri_XX/Liber_IX
    - texte: "Les justes, nos pères, distinguaient pour les biens temporels le sort de leurs fils de la condition de leurs esclaves, mais veillaient d'un égal amour sur tous les membres de leur maison pour le culte de Dieu : de là, selon l'ordre naturel, vient le nom de père de famille, si répandu que les maîtres injustes eux-mêmes aiment à le porter."
      citation: "Quocirca etiamsi habuerunt seruos iusti patres nostri, sic administrabant domesticam pacem, ut secundum haec temporalia bona filiorum sortem a seruorum condicione distinguerent; ad Deum autem colendum, in quo aeterna bona speranda sunt, omnibus domus suae membris pari dilectione consulerent. Quod naturalis ordo ita praescribit, ut nomen patrum familias hinc exortum sit et tam late uulgatum, ut etiam inique dominantes hoc se gaudeant appellari."
      sources:
        - ouvrage: la-cite-de-dieu
          entree: "XIX, 16"
          url: https://la.wikisource.org/wiki/De_civitate_Dei/Liber_XIX
