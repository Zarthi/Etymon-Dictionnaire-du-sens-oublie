mot: perdre
nature: [ verbe ]
etymologie:
  - forme: perdere
    langue: latin
    sens: détruire, ruiner ; employer inutilement
explication: >-
  Perdere, formé de per et dare, « donner », disait détruire, ruiner, et aussi
  employer sans profit. Le français a retenu l'idée de privation : perdre, c'est
  cesser d'avoir, non plus dissiper.
