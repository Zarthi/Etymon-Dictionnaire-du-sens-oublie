mot: péché
nature: [ nom masculin ]
etymologie:
  - forme: peccatum
    langue: latin ecclésiastique
    sens: faute contre la loi divine
  - forme: peccatum
    langue: latin
    sens: faute
explication: >-
  Peccatum nommait toute faute ; le latin chrétien en a fait la faute contre
  Dieu. Le français a gardé ce sens religieux et l'a affaibli jusqu'à la faute
  ordinaire, voire au simple défaut.
themes: [ religion, morale ]
tradition:
