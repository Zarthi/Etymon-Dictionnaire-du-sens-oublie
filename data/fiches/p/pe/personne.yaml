mot: personne
nature: [ nom féminin ]
etymologie:
  - forme: persona
    langue: latin
    sens: masque de l'acteur
    premier: true
  - forme: φersu
    langue: étrusque
    sens: personnage masqué
explication: >-
  La persona est le masque que l'acteur porte sur la scène, puis le rôle qu'il joue. Le
  droit romain en a fait le sujet de droits, et la théologie chrétienne l'a appliqué aux
  trois Personnes divines ; le mot désigne aujourd'hui tout individu.
ecartees:
  - forme: personare
    langue: latin
    sens: résonner à travers
    selon: [ gavius-bassus ]
    raison: "Le Littré l'écarte : l'o est bref dans personare, long dans persona."
famille: [ personnage, personnel, personnalité ]
themes: [ esprit, société ]
sources:
  - ouvrage: littre
    entree: personne
  - ouvrage: tlfi
    entree: personne
redaction:
  - par: IA
    detail: Claude Opus 5.5
statut: brouillon
