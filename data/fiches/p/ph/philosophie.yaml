mot: philosophie
nature: [ nom féminin ]
etymologie:
  - forme: philosophia
    langue: latin
  - forme: φιλοσοφία
    langue: grec ancien
    sens: amour de la sagesse
    elements:
      - forme: φίλος
        sens: ami, qui aime
      - forme: σοφία
        sens: sagesse, savoir
explication: >-
  Le philosophe ne se disait pas savant : il aimait ce qu'il ne possédait pas.
  Le mot nomme aujourd'hui une discipline, voire une simple opinion.
