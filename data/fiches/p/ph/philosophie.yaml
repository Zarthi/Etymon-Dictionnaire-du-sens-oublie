mot: philosophie
nature: [ nom féminin ]
etymologie:
  - forme: philosophia
    langue: latin
  - forme: φιλοσοφία
    langue: grec ancien
    sens: amour de la sagesse
    elements:
      - forme: φίλος
        sens: ami, qui aime
      - forme: σοφία
        sens: sagesse, savoir
explication: >-
  Le philosophe ne se disait pas sage : il aimait une sagesse qu'il ne possédait pas. Le
  mot désigne aujourd'hui une discipline, et même une simple manière de voir.
famille: [ philosophe, philosophique ]
themes: [ savoir, esprit ]
sources:
