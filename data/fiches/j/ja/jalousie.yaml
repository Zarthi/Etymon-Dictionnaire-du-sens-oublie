statut: brouillon
tradition:
  lectures:
    - texte: "Le zelus naît de l'intensité de l'amour : qui convoite ardemment se dresse contre tout ce qui l'empêche de jouir en paix de ce qu'il aime ; ainsi les maris sont dits zelare leurs épouses, pour qu'aucun partage ne leur ôte la singularité qu'ils cherchent en elles."
      citation: "zelus, quocumque modo sumatur, ex intensione amoris provenit. […] Nam in amore concupiscentiae, qui intense aliquid concupiscit, movetur contra omne illud quod repugnat consecutioni vel fruitioni quietae eius quod amatur. Et hoc modo viri dicuntur zelare uxores, ne per consortium aliorum impediatur singularitas quam in uxore quaerunt."
      sources:
        - ouvrage: somme-theologique
          entree: "Ia-IIae, q. 28, a. 4, co."
          url: https://www.corpusthomisticum.org/sth2026.html
