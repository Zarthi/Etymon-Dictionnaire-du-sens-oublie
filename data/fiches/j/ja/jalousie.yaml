mot: jalousie
nature: [ nom féminin ]
etymologie:
  - forme: jaloux
    langue: français
  - forme: zelosus
    langue: bas latin
    sens: plein d'amour et de prévenance
  - forme: zelus
    langue: latin
  - forme: ζῆλος
    langue: grec ancien
    sens: ardeur, émulation, jalousie
explication: >-
  Entre 1181 et 1191, jalousie disait l'inquiétude de l'amant sur la fidélité de
  l'être aimé ; en 1501, l'envie devant ce qu'un autre possède. Le mot nomme
  aujourd'hui l'amour exclusif qui craint l'infidélité et la peine devant les
  biens d'autrui ; zèle, issu du même mot latin, a gardé l'ardeur.
famille: [ jaloux ]
themes: [ émotions ]
